plugins {
    id 'com.android.application'
}

android {
    namespace 'com.limsj.docviewer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.limsj.docviewer'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile file('../keystore/docviewer.jks')
            storePassword 'docviewer'
            keyAlias 'docviewer'
            keyPassword 'docviewer'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }
}
