plugins {
    id 'com.android.application'
}

android {
    namespace 'com.limsj.docviewer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.limsj.docviewer'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '1.3'
    }

    // Release signing comes from keystore.properties (git-ignored) or environment variables;
    // without them the release APK is built unsigned instead of with a published key.
    def signingProps = new Properties()
    def signingFile = rootProject.file('keystore.properties')
    if (signingFile.exists()) signingFile.withInputStream { signingProps.load(it) }
    def signingValue = { String key, String env -> signingProps.getProperty(key) ?: System.getenv(env) }
    def hasSigning = signingValue('storeFile', 'DOCVIEWER_STORE_FILE') != null

    signingConfigs {
        release {
            if (hasSigning) {
                storeFile rootProject.file(signingValue('storeFile', 'DOCVIEWER_STORE_FILE'))
                storePassword signingValue('storePassword', 'DOCVIEWER_STORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'DOCVIEWER_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'DOCVIEWER_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigning) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }
}
