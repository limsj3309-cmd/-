plugins {
    id 'com.android.application'
}

android {
    namespace 'kr.golfmacro.app'
    compileSdk 35

    defaultConfig {
        applicationId 'kr.golfmacro.app'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName "1.8"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
