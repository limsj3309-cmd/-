          const arr = [];
          for (let k = 0; k < s.length; k++) {
            if (s[k] === '=' && /^[0-9A-F]{2}$/i.test(s.substr(k + 1, 2))) { arr.push(parseInt(s.substr(k + 1, 2), 16)); k += 2; }
            else arr.push(s.charCodeAt(k) & 0xff);
          }
          bytes = new Uint8Array(arr);
        } else if (te === 'base64') bytes = base64ToBytes(body.replace(/\s+/g, ''));
        else bytes = Uint8Array.from(body, (ch) => ch.charCodeAt(0) & 0xff);
        try { html = new TextDecoder(charset).decode(bytes); } catch (e) { html = new TextDecoder('utf-8').decode(bytes); }
      } else if (/^image\//i.test(type) && te === 'base64' && loc) {
        res[loc.trim()] = 'data:' + type.trim() + ';base64,' + body.replace(/\s+/g, '');
      }
    }
    if (html) {
      for (const [loc, url] of Object.entries(res)) {
        const name = loc.split('/').pop();
        html = html.split('"' + loc + '"').join('"' + url + '"');
        if (name) html = html.replace(new RegExp('"[^"]*' + name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '"', 'g'), '"' + url + '"');
      }
    }
    return html;
  }

  /** 편집기 내용 → Word가 열 수 있는 HTML 형식의 .doc */
  function buildDoc(root, title) {
    const clone = root.cloneNode(true);
    clone.querySelectorAll('.page-break').forEach((pb) => {
      const br = document.createElement('br');
      br.setAttribute('clear', 'all');
      br.setAttribute('style', 'page-break-before:always');
      pb.replaceWith(br);
    });
    clone.querySelectorAll('[contenteditable]').forEach((e) => e.removeAttribute('contenteditable'));
    clone.querySelectorAll('[data-pg-tall]').forEach((e) => e.removeAttribute('data-pg-tall'));
    clone.querySelectorAll('[style*="--pg-"]').forEach((e) => { e.style.removeProperty('--pg-mt'); e.style.removeProperty('--pg-pb'); });
    clone.querySelectorAll('.page-break').forEach((e) => { e.style.height = ''; });
    clone.querySelectorAll('table').forEach((t) => {
      t.setAttribute('border', '1');
      t.setAttribute('cellspacing', '0');
      t.setAttribute('cellpadding', '0');
      t.style.borderCollapse = 'collapse';
      if (!t.style.width) t.style.width = '100%';
    });
    clone.querySelectorAll('td,th').forEach((c) => {
      c.style.border = 'solid windowtext 1pt';
      c.style.padding = '0 5.4pt';
      if (!c.style.verticalAlign) c.style.verticalAlign = 'top';
    });
    // 문단(div)은 Word가 잘 알아보는 <p>로 바꾸고, 꾸밈 없는 감싸기 div는 벗김
    Array.from(clone.querySelectorAll('div')).reverse().forEach((d) => {
      if (d.querySelector('div,p,ul,ol,table,h1,h2,h3,h4,h5,h6,blockquote')) {
        if (!d.getAttribute('style')) d.replaceWith(...d.childNodes);
        return;
      }
      const p = document.createElement('p');
      for (const a of d.attributes) p.setAttribute(a.name, a.value);
      p.append(...d.childNodes);
      d.replaceWith(p);
    });
    clone.querySelectorAll('.sel-img').forEach((e) => e.classList.remove('sel-img'));
    // 편집기의 CSS 줄 높이(배수)를 Word의 줄 간격(%)으로 변환
    clone.querySelectorAll('[style*="line-height"]').forEach((e) => {
      const v = e.style.lineHeight;
      if (/^[\d.]+$/.test(v)) e.style.lineHeight = Math.round((parseFloat(v) / LW.LINE_FACTOR) * 100) + '%';
    });
    // 탭과 연속 공백은 HTML에서 사라지므로 변환
    const walker = document.createTreeWalker(clone, NodeFilter.SHOW_TEXT);
    const texts = [];
    while (walker.nextNode()) texts.push(walker.currentNode);
    for (const t of texts) {
      if (!/\t| {2}|\n/.test(t.data)) continue;
      const html = escapeHtml(t.data)
        .replace(/\t/g, "<span style='mso-tab-count:1'>&#9;</span>")
        .replace(/ {2}/g, ' &nbsp;')
        .replace(/\n/g, '<br>');
      const span = document.createElement('span');
      span.innerHTML = html;
      t.replaceWith(...span.childNodes);
    }
    const h = LW.HEADINGS.map((x, i) => `h${i + 1}{font-size:${x.sizePt}pt;margin:${x.beforePt}pt 0 ${x.afterPt}pt}`).join('\n');
    const html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">' +
      '<head><meta http-equiv="Content-Type" content="text/html; charset=utf-8"><meta name="Generator" content="현서의 글방">' +
      `<title>${escapeHtml(title || '')}</title>` +
      '<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom><w:DoNotOptimizeForBrowser/></w:WordDocument></xml><![endif]-->' +
      '<style>@page WordSection1{size:595.3pt 841.9pt;margin:72pt 72pt 72pt 72pt;mso-header-margin:42.55pt;mso-footer-margin:49.6pt}' +
      'div.WordSection1{page:WordSection1}' +
      `body{font-family:"${LW.DEFAULT_FONT}","Malgun Gothic",sans-serif;font-size:${LW.DEFAULT_SIZE_PT}pt}` +
      `p,li{margin:0 0 ${LW.DEFAULT_AFTER_PT}pt;line-height:${Math.round(LW.DEFAULT_LINE * 100)}%}li{margin:0}` +
      'table{border-collapse:collapse}td,th{border:solid windowtext .5pt;padding:0 5.4pt;vertical-align:top}td p,th p{margin:0}' +
      h + '</style></head>' +
      `<body lang="KO"><div class="WordSection1">${clone.innerHTML}</div></body></html>`;
    return new Blob(['﻿' + html], { type: 'application/msword' });
  }

  return { sanitize, mhtToHtml, buildDoc, pageBreak, tidy };
})();

/* ===== editor.js ===== */
/* 편집기: 서식 명령, 도구 모음 상태, 표·그림·링크, 키보드 */
const $ = (id) => document.getElementById(id);
const App = {
  editor: null, savedRange: null, pendingSizePt: null, zoom: 1,
  fileHandle: null, fileName: '제목 없음', fileFormat: null, canOverwrite: false, dirty: false,
  lastFore: 'C00000', lastHilite: 'FFFF00',
};
const BLOCK_SEL = 'p,h1,h2,h3,h4,h5,h6,li,pre,blockquote,div:not(.page-break),td,th';
const CONTENT_W_PX = Math.round(LW.CONTENT_W_TW / 15);

function exec(cmd, val) {
  return document.execCommand(cmd, false, val === undefined ? null : val);
}

// ---------- 편집기 만들기 ----------
function createEditor(fragment) {
  const ed = document.createElement('div');
  ed.id = 'editor';
  ed.className = 'editor';
  ed.contentEditable = 'true';
  ed.spellcheck = false;
  ed.setAttribute('role', 'textbox');
  ed.setAttribute('aria-multiline', 'true');
  ed.setAttribute('aria-label', '문서 본문');
  if (fragment) ed.appendChild(fragment);
  if (!ed.firstChild) ed.innerHTML = '<div><br></div>';
  // 편집기 루트에 바로 붙은 글자는 문단으로 감싸기
  const loose = Array.from(ed.childNodes).filter((n) => n.nodeType === 3 || (n.nodeType === 1 && !n.matches(BLOCK_SEL + ',ul,ol,table,.page-break')));
  if (loose.length) {
    let p = null;
    for (const n of Array.from(ed.childNodes)) {
      if (loose.includes(n)) {
        if (!p) { p = document.createElement('div'); n.before(p); }
        p.appendChild(n);
      } else p = null;
    }
  }
  ed.querySelectorAll('.page-break').forEach((d) => { d.setAttribute('contenteditable', 'false'); d.textContent = ''; });
  const old = $('editor');
  if (old) old.replaceWith(ed);
  else $('page').appendChild(ed);
  App.editor = ed;
  App.savedRange = null;
  bindEditor(ed);
  exec('defaultParagraphSeparator', 'div');
  exec('styleWithCSS', true);
  const r = document.createRange();
  r.setStart(firstTextPos(ed), 0);
  r.collapse(true);
  App.savedRange = r;
  Pages.paginate();
  return ed;
}

function firstTextPos(ed) {
  let n = ed;
  while (n.firstChild && n.firstChild.nodeType === 1 && !/^(BR|IMG)$/.test(n.firstChild.nodeName) && !n.firstChild.classList.contains('page-break')) n = n.firstChild;
  return n;
}

function focusEditor() {
  const ed = App.editor;
  const sel = getSelection();
  const inside = sel.rangeCount && ed.contains(sel.anchorNode);
  if (document.activeElement !== ed || !inside) {
    ed.focus({ preventScroll: true });
    if (App.savedRange && ed.contains(App.savedRange.startContainer)) {
      sel.removeAllRanges();
      sel.addRange(App.savedRange);
    } else if (!inside) {
      const r = document.createRange();
      r.setStart(firstTextPos(ed), 0);
      sel.removeAllRanges();
      sel.addRange(r);
    }
  }
}

function currentRange() {
  const sel = getSelection();
  if (sel.rangeCount && App.editor.contains(sel.anchorNode)) return sel.getRangeAt(0);
  return App.savedRange;
}

function anchorElement() {
  const r = currentRange();
  if (!r) return App.editor;
  let n = r.startContainer;
  if (n.nodeType === 1 && n.childNodes[r.startOffset] && n.childNodes[r.startOffset].nodeType === 3) n = n.childNodes[r.startOffset];
  return n.nodeType === 1 ? n : n.parentElement;
}

function blockOf(node) {
  const el = node && (node.nodeType === 1 ? node : node.parentElement);
  if (!el || !App.editor.contains(el)) return null;
  const b = el.closest('p,h1,h2,h3,h4,h5,h6,li,pre,td,th,blockquote,div:not(.page-break):not(#editor)');
  return b && App.editor.contains(b) && b !== App.editor ? b : null;
}

function selectedBlocks() {
  const r = currentRange();
  if (!r) return [];
  const out = [];
  if (!r.collapsed) {
    App.editor.querySelectorAll('p,div:not(.page-break),h1,h2,h3,h4,h5,h6,li,pre').forEach((el) => {
      if (r.intersectsNode(el) && !el.querySelector('p,div:not(.page-break),h1,h2,h3,h4,h5,h6,li,pre,table')) out.push(el);
    });
  }
  if (!out.length) {
    const b = blockOf(r.startContainer);
    if (b) out.push(b);
  }
  return out;
}

function markDirty() {
  Pages.paginate();
  if (!App.dirty) {
    App.dirty = true;
    updateTitle();
  }
  scheduleAutosave();
  scheduleStats();
}

// ---------- 서식 명령 ----------
const SIMPLE = ['bold', 'italic', 'underline', 'strikeThrough', 'superscript', 'subscript', 'removeFormat', 'justifyLeft',
  'justifyCenter', 'justifyRight', 'justifyFull', 'insertUnorderedList', 'insertOrderedList', 'indent', 'outdent', 'undo', 'redo'];

function runCommand(cmd) {
  if (SIMPLE.includes(cmd)) {
    focusEditor();
    if (cmd === 'removeFormat') {
      exec('removeFormat');
      exec('unlink');
    } else exec(cmd);
    markDirty();
    updateToolbar();
    return;
  }
  const fn = COMMANDS[cmd];
  if (fn) fn();
}

const COMMANDS = {
  new: () => FileOps.newDoc(),
  open: () => FileOps.open(),
  save: () => FileOps.save(),
  saveAs: () => FileOps.saveAs(),
  print: () => window.print(),
  foreColorApply: () => applyColor('fore', App.lastFore),
  hiliteApply: () => applyColor('hilite', App.lastHilite),
  insertImage: () => $('imageInput').click(),
  link: () => editLink(),
  pageBreak: () => insertPageBreak(),
  find: () => Find.open(false),
};

function applyColor(kind, hex) {
  focusEditor();
  if (kind === 'fore') {
    const c = hex === 'auto' ? '#000000' : '#' + hex;
    exec('foreColor', c);
    if (hex !== 'auto') { App.lastFore = hex; $('foreBar').style.background = c; }
  } else {
    const c = hex === 'none' ? 'transparent' : '#' + hex;
    if (!exec('hiliteColor', c)) exec('backColor', c);
    if (hex !== 'none') { App.lastHilite = hex; $('hiliteBar').style.background = c; }
  }
  markDirty();
}

function applyFont(name) {
  focusEditor();
  exec('fontName', cssFontStack([name]));
  markDirty();
  updateToolbar();
}

/** 글자 크기(pt): fontSize 7로 표시한 뒤 실제 pt 값으로 바꿈 */
function applySize(pt) {
  focusEditor();
  App.pendingSizePt = pt;
  exec('fontSize', '7');
  fixFontSizes();
  markDirty();
  updateToolbar();
}

function fixFontSizes() {
  if (!App.pendingSizePt) return;
  App.editor.querySelectorAll('font[size="7"], span[style*="xxx-large"], span[style*="-webkit-xxx-large"]').forEach((el) => {
    el.removeAttribute('size');
    el.style.fontSize = App.pendingSizePt + 'pt';
  });
}

function applyBlockStyle(tag) {
  focusEditor();
  const blocks = selectedBlocks();
  // 목록 항목/표 칸 안에서는 formatBlock이 구조를 깨므로 지원하는 경우에만 실행
  exec('formatBlock', '<' + (tag === 'p' ? 'div' : tag) + '>');
  markDirty();
  updateToolbar();
  return blocks;
}

function applyLineSpacing(mul) {
  focusEditor();
  const blocks = selectedBlocks();
  for (const b of blocks) {
    if (Math.abs(mul - LW.DEFAULT_LINE) < 0.001 && /^(P|DIV|LI|TD|TH)$/.test(b.nodeName)) b.style.lineHeight = '';
    else b.style.lineHeight = String(+(mul * LW.LINE_FACTOR).toFixed(3));
    if (!b.getAttribute('style')) b.removeAttribute('style');
  }
  markDirty();
  updateToolbar();
}

function insertPageBreak() {
  focusEditor();
  exec('insertHTML', '<div class="page-break" contenteditable="false"></div><div><br></div>');
  normalizePageBreaks();
  markDirty();
}

function normalizePageBreaks() {
  App.editor.querySelectorAll('.page-break').forEach((d) => {
    if (d.getAttribute('contenteditable') !== 'false') d.setAttribute('contenteditable', 'false');
    if (d.firstChild) d.textContent = '';
  });
}

// ---------- 링크 ----------
function editLink() {
  focusEditor();
  const r = currentRange();
  const a = anchorElement() && anchorElement().closest('a');
  const range = r ? r.cloneRange() : null;
  const hasText = range && !range.collapsed;
  Dialog.form({
    title: a ? '링크 편집' : '링크 삽입',
    fields: [
      { id: 'url', label: '주소 (URL)', value: a ? a.getAttribute('href') : 'https://', type: 'url' },
      ...(hasText || a ? [] : [{ id: 'text', label: '표시할 글자', value: '' }]),
    ],
    ok: '확인',
    extra: a ? { label: '링크 제거', action: () => { restore(); if (!range || range.collapsed) selectNode(a); exec('unlink'); markDirty(); } } : null,
  }).then((v) => {
    if (!v) return;
    let url = v.url.trim();
    if (!url || url === 'https://') return;
    if (!/^[a-z][a-z0-9+.-]*:/i.test(url)) url = (/@/.test(url) ? 'mailto:' : 'https://') + url;
    restore();
    if (a && (!range || range.collapsed)) { selectNode(a); exec('createLink', url); }
    else if (hasText) exec('createLink', url);
    else exec('insertHTML', `<a href="${escapeHtml(url)}">${escapeHtml(v.text || url)}</a>`);
    markDirty();
  });
  function restore() {
    App.editor.focus({ preventScroll: true });
    if (range) { const s = getSelection(); s.removeAllRanges(); s.addRange(range); }
  }
}

function selectNode(n) {
  const r = document.createRange();
  r.selectNodeContents(n);
  const s = getSelection();
  s.removeAllRanges();
  s.addRange(r);
}

// ---------- 그림 ----------
function readAsDataURL(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = () => rej(fr.error);
    fr.readAsDataURL(file);
  });
}

function imageSize(src) {
  return new Promise((res) => {
    const im = new Image();
    im.onload = () => res({ w: im.naturalWidth, h: im.naturalHeight });
    im.onerror = () => res({ w: 0, h: 0 });
    im.src = src;
  });
}

async function insertImageFiles(files) {
  let html = '';
  for (const f of files) {
    if (!/^image\//.test(f.type)) continue;
    let src = await readAsDataURL(f);
    const sz = await imageSize(src);
    if (!sz.w) continue;
    if (!/^data:image\/(png|jpeg|gif|bmp)/.test(src)) src = await toPng(src, sz);
    const w = Math.min(sz.w, CONTENT_W_PX);
    html += `<img src="${src}" width="${w}">`;
  }
  if (!html) return;
  focusEditor();
  exec('insertHTML', html);
  markDirty();
}

function toPng(src, sz) {
  return new Promise((res) => {
    const im = new Image();
    im.onload = () => {
      const c = document.createElement('canvas');
      c.width = sz.w;
      c.height = sz.h;
      c.getContext('2d').drawImage(im, 0, 0);
      res(c.toDataURL('image/png'));
    };
    im.onerror = () => res(src);
    im.src = src;
  });
}

let selectedImg = null;
function selectImage(img) {
  if (selectedImg && selectedImg !== img) selectedImg.classList.remove('sel-img');
  selectedImg = img;
  if (!img) { Popups.hide('popImg'); return; }
  img.classList.add('sel-img');
  const r = img.getBoundingClientRect();
  Popups.showAt('popImg', r.left, r.bottom + 6);
}

function resizeImage(pct) {
  const img = selectedImg;
  if (!img) return;
  if (pct === 0) {
    const w = Math.min(img.naturalWidth || CONTENT_W_PX, CONTENT_W_PX);
    img.setAttribute('width', w);
  } else img.setAttribute('width', Math.round((CONTENT_W_PX * pct) / 100));
  img.removeAttribute('height');
  img.style.width = '';
  img.style.height = '';
  markDirty();
  selectImage(img);
}

// ---------- 표 ----------
function insertTable(rows, cols) {
  focusEditor();
  const tr = '<tr>' + '<td><div><br></div></td>'.repeat(cols) + '</tr>';
  exec('insertHTML', `<table><tbody>${tr.repeat(rows)}</tbody></table><div><br></div>`);
  // 첫 칸으로 커서 이동
  const tables = App.editor.querySelectorAll('table');
  const r = currentRange();
  let target = null;
  tables.forEach((t) => {
    if (r && t.compareDocumentPosition(r.startContainer) & Node.DOCUMENT_POSITION_FOLLOWING) target = t;
  });
  if (target) placeCaret(target.rows[0].cells[0]);
  markDirty();
}

function placeCaret(el, atEnd) {
  const r = document.createRange();
  let n = el;
  while (n.firstChild && n.firstChild.nodeType === 1 && !/^(BR|IMG)$/.test(n.firstChild.nodeName)) n = atEnd ? n.lastChild : n.firstChild;
  r.selectNodeContents(n);
  r.collapse(!atEnd);
  const s = getSelection();
  s.removeAllRanges();
  s.addRange(r);
}

function tableGrid(table) {
  const occ = [];
  const start = new Map();
  Array.from(table.rows).forEach((tr, r) => {
    occ[r] = occ[r] || [];
    let c = 0;
    for (const cell of tr.cells) {
      while (occ[r][c]) c++;
      start.set(cell, { r, c });
      for (let i = 0; i < cell.rowSpan; i++) {
        occ[r + i] = occ[r + i] || [];
        for (let j = 0; j < cell.colSpan; j++) occ[r + i][c + j] = cell;
      }
      c += cell.colSpan;
    }
  });
  const nCols = Math.max(0, ...occ.map((row) => row.length));
  return { occ, start, nCols, nRows: table.rows.length };
}

function newCell(doc) {
  const td = doc.createElement('td');
  td.innerHTML = '<div><br></div>';
  return td;
}

const TableOps = {
  rowAbove: (t, cell) => insertRow(t, tableGrid(t).start.get(cell).r),
  rowBelow: (t, cell) => { const g = tableGrid(t); insertRow(t, g.start.get(cell).r + cell.rowSpan); },
  colLeft: (t, cell) => insertCol(t, tableGrid(t).start.get(cell).c),
  colRight: (t, cell) => { const g = tableGrid(t); insertCol(t, g.start.get(cell).c + cell.colSpan); },
  delRow: (t, cell) => deleteRow(t, tableGrid(t).start.get(cell).r),
  delCol: (t, cell) => deleteCol(t, tableGrid(t).start.get(cell).c),
};

function insertRow(t, at) {
  const g = tableGrid(t);
  const tr = t.ownerDocument.createElement('tr');
  const done = new Set();
  for (let c = 0; c < g.nCols; c++) {
    const above = at > 0 ? g.occ[at - 1] && g.occ[at - 1][c] : null;
    const here = g.occ[at] && g.occ[at][c];
    if (above && above === here) {
      if (!done.has(above)) { above.rowSpan += 1; done.add(above); }
      continue;
    }
    tr.appendChild(newCell(t.ownerDocument));
  }
  const ref = t.rows[at];
  if (ref) ref.parentNode.insertBefore(tr, ref);
  else (t.tBodies[0] || t).appendChild(tr);
  return tr;
}

function insertCol(t, at) {
  const g = tableGrid(t);
  const done = new Set();
  Array.from(t.rows).forEach((tr, r) => {
    const cell = g.occ[r] && g.occ[r][at];
    if (cell && g.start.get(cell).c < at) {
      if (!done.has(cell)) { cell.colSpan += 1; done.add(cell); }
      return;
    }
    let before = null;
    for (const c of tr.cells) if (g.start.get(c).c >= at) { before = c; break; }
    tr.insertBefore(newCell(t.ownerDocument), before);
  });
  t.querySelectorAll('colgroup').forEach((cg) => cg.remove());
}

function deleteRow(t, r) {
  const g = tableGrid(t);
  const tr = t.rows[r];
  const done = new Set();
  for (let c = 0; c < g.nCols; c++) {
    const cell = g.occ[r] && g.occ[r][c];
    if (!cell || done.has(cell)) continue;
    done.add(cell);
    const s = g.start.get(cell);
    if (cell.rowSpan > 1) {
      if (s.r < r) cell.rowSpan -= 1;
      else {
        // 이 행에서 시작한 세로 병합 칸은 다음 행으로 옮김
        const next = t.rows[r + 1];
        cell.rowSpan -= 1;
        let before = null;
        for (const c2 of next.cells) if (g.start.get(c2).c > s.c) { before = c2; break; }
        next.insertBefore(cell, before);
      }
    }
  }
  tr.remove();
  if (!t.rows.length) t.remove();
}

function deleteCol(t, c) {
  const g = tableGrid(t);
  const done = new Set();
  for (let r = 0; r < g.nRows; r++) {
    const cell = g.occ[r] && g.occ[r][c];
    if (!cell || done.has(cell)) continue;
    done.add(cell);
    if (cell.colSpan > 1) cell.colSpan -= 1;
    else cell.remove();
  }
  Array.from(t.rows).forEach((tr) => { if (!tr.cells.length) tr.remove(); });
  t.querySelectorAll('colgroup').forEach((cg) => cg.remove());
  if (!t.rows.length) t.remove();
}

/** 표 편집: 복제본을 고친 뒤 insertHTML로 바꿔 넣어 실행 취소가 가능하게 함 */
function tableCommand(op) {
  const a = anchorElement();
  const cell = a && a.closest('td,th');
  if (!cell || !App.editor.contains(cell)) return;
  const table = cell.closest('table');
  const pos = tableGrid(table).start.get(cell);
  focusEditor();
  const range = document.createRange();
  range.selectNode(table);
  const s = getSelection();
  s.removeAllRanges();
  s.addRange(range);
  if (op === 'delTable') {
    exec('delete');
    markDirty();
    return;
  }
  const clone = table.cloneNode(true);
  const cCell = tableGrid(clone).occ[pos.r][pos.c];
  TableOps[op](clone, cCell);
  if (!clone.isConnected && !clone.rows.length) {
    exec('delete');
    markDirty();
    return;
  }
  clone.setAttribute('data-lw-new', '1');
  exec('insertHTML', clone.outerHTML);
  const nt = App.editor.querySelector('table[data-lw-new]');
  if (nt) {
    nt.removeAttribute('data-lw-new');
    const g = tableGrid(nt);
    let r = pos.r, c = pos.c;
    if (op === 'rowBelow') r = pos.r + cell.rowSpan;
    if (op === 'colRight') c = pos.c + cell.colSpan;
    r = Math.min(r, g.nRows - 1);
    const row = g.occ[r] || g.occ[g.nRows - 1];
    const target = row && (row[Math.min(c, row.length - 1)]);
    if (target) placeCaret(target);
  }
  markDirty();
}

function moveCell(cell, back) {
  const table = cell.closest('table');
  const cells = Array.from(table.querySelectorAll('td,th')).filter((c) => c.closest('table') === table);
  const i = cells.indexOf(cell) + (back ? -1 : 1);
  if (i >= 0 && i < cells.length) {
    const r = document.createRange();
    r.selectNodeContents(cells[i]);
    const s = getSelection();
    s.removeAllRanges();
    s.addRange(r);
  } else if (!back) {
    tableCommand('rowBelow');
  }
}

// ---------- 도구 모음 상태 ----------
let tbScheduled = false;
function scheduleToolbar() {
  if (tbScheduled) return;
  tbScheduled = true;
  requestAnimationFrame(() => { tbScheduled = false; updateToolbar(); });
}

function ensureOption(sel, value, label) {
  let o = Array.from(sel.options).find((x) => x.value === value);
  sel.querySelectorAll('option.tmp').forEach((x) => { if (x !== o) x.remove(); });
  if (!o) {
    o = document.createElement('option');
    o.value = value;
    o.textContent = label || value;
    o.className = 'tmp';
    sel.insertBefore(o, sel.firstChild);
  }
  sel.value = value;
}

function updateToolbar() {
  if (!App.editor) return;
  const el = anchorElement();
  if (!el || !App.editor.contains(el)) return;
  for (const cmd of ['bold', 'italic', 'underline', 'strikeThrough', 'superscript', 'subscript', 'insertUnorderedList', 'insertOrderedList']) {
    let on = false;
    try { on = document.queryCommandState(cmd); } catch (e) { /* 무시 */ }
    document.querySelectorAll(`[data-cmd="${cmd}"]`).forEach((b) => b.classList.toggle('on', on));
  }
  const cs = getComputedStyle(el);
  const block = blockOf(el);
  const align = block ? getComputedStyle(block).textAlign : 'left';
  const amap = { justifyLeft: /left|start/, justifyCenter: /center/, justifyRight: /right|end/, justifyFull: /justify/ };
  for (const [cmd, re] of Object.entries(amap)) document.querySelector(`[data-cmd="${cmd}"]`).classList.toggle('on', re.test(align));
  const head = el.closest('h1,h2,h3,h4,h5,h6');
  const tag = head && App.editor.contains(head) ? head.nodeName.toLowerCase() : 'p';
  ensureOption($('selStyle'), tag, tag === 'p' ? '본문' : '제목 ' + tag[1]);
  const f = parseFontStack(cs.fontFamily).ascii;
  ensureOption($('selFont'), f, f);
  const pt = String(Math.round(parseFloat(cs.fontSize) * 0.75 * 2) / 2);
  ensureOption($('selSize'), pt, pt);
  let lh = '';
  for (let b = block; b && b !== App.editor; b = b.parentElement) if (b.style && b.style.lineHeight) { lh = b.style.lineHeight; break; }
  let mul = LW.DEFAULT_LINE;
  if (/^[\d.]+$/.test(lh)) mul = Math.round((parseFloat(lh) / LW.LINE_FACTOR) * 100) / 100;
  const mv = [1, 1.15, 1.5, 2, 2.5, 3].find((x) => Math.abs(x - mul) < 0.01);
  ensureOption($('selLine'), mv !== undefined ? mv.toFixed(mv === 1.15 ? 2 : 1) : String(mul), String(mul));
}

// ---------- 키보드·붙여넣기·끌어 놓기 ----------
function bindEditor(ed) {
  ed.addEventListener('input', () => {
    fixFontSizes();
    normalizePageBreaks();
    if (!ed.firstChild) ed.innerHTML = '<div><br></div>';
    markDirty();
    Pages.revealCaret();
  });
  // 그림이 늦게 읽히면 쪽을 다시 나눔
  ed.addEventListener('load', () => Pages.schedule(), true);
  ed.addEventListener('keydown', onEditorKey);
  ed.addEventListener('paste', onPaste);
  ed.addEventListener('click', (e) => {
    const img = e.target.closest && e.target.closest('img');
    selectImage(img && ed.contains(img) ? img : null);
    const a = e.target.closest && e.target.closest('a[href]');
    if (a && (e.ctrlKey || e.metaKey) && /^(https?:|mailto:|ftp:)/i.test(a.href)) window.open(a.href, '_blank', 'noopener');
  });
  ed.addEventListener('dragover', (e) => {
    if (e.dataTransfer && Array.from(e.dataTransfer.types).includes('Files')) e.preventDefault();
  });
  ed.addEventListener('drop', (e) => {
    const files = Array.from((e.dataTransfer && e.dataTransfer.files) || []);
    if (!files.length) return;
    e.preventDefault();
    e.stopPropagation();
    const imgs = files.filter((f) => /^image\//.test(f.type));
    if (imgs.length) {
      const r = document.caretRangeFromPoint ? document.caretRangeFromPoint(e.clientX, e.clientY) : null;
      if (r) { const s = getSelection(); s.removeAllRanges(); s.addRange(r); App.savedRange = r.cloneRange(); }
      insertImageFiles(imgs);
    } else FileOps.openFile(files[0]);
  });
}

function onEditorKey(e) {
  if (e.isComposing || e.keyCode === 229) return;
  const a = anchorElement();
  if (e.key === 'Tab' && !e.ctrlKey && !e.altKey && !e.metaKey) {
    e.preventDefault();
    const cell = a && a.closest('td,th');
    const li = a && a.closest('li');
    if (cell && App.editor.contains(cell) && !(li && cell.contains(li))) moveCell(cell, e.shiftKey);
    else if (li && App.editor.contains(li)) { exec(e.shiftKey ? 'outdent' : 'indent'); markDirty(); }
    else if (!e.shiftKey) exec('insertText', '\t');
    return;
  }
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    insertPageBreak();
    return;
  }
  // 선택된 그림 지우기
  if ((e.key === 'Backspace' || e.key === 'Delete') && selectedImg && selectedImg.isConnected && getSelection().isCollapsed) {
    const img = selectedImg;
    const r = document.createRange();
    r.selectNode(img);
    const s = getSelection();
    s.removeAllRanges();
    s.addRange(r);
    e.preventDefault();
    exec('delete');
    selectImage(null);
    return;
  }
  if (selectedImg) selectImage(null);
}

function onPaste(e) {
  const dt = e.clipboardData;
  if (!dt) return;
  const html = dt.getData('text/html');
  const text = dt.getData('text/plain');
  const files = Array.from(dt.files || []).filter((f) => /^image\//.test(f.type));
  const htmlHasText = html && new DOMParser().parseFromString(html, 'text/html').body.textContent.trim();
  e.preventDefault();
  if (files.length && !htmlHasText) { insertImageFiles(files); return; }
  if (html) {
    const frag = HtmlIO.sanitize(html, document);
    const box = document.createElement('div');
    box.appendChild(frag);
    // 문단 하나만 붙여넣을 때는 감싸는 블록을 벗겨서 현재 문단에 이어 붙임
    if (box.children.length === 1 && /^(P|DIV)$/.test(box.firstChild.nodeName) && box.childNodes.length === 1 && !box.firstChild.getAttribute('style')) {
      box.innerHTML = box.firstChild.innerHTML;
    }
    box.querySelectorAll('br').forEach((br) => { if (!br.nextSibling && br.parentNode === box && box.childNodes.length > 1) br.remove(); });
    exec('insertHTML', box.innerHTML);
  } else if (text) {
    const lines = text.replace(/\r\n?/g, '\n').split('\n');
    if (lines.length === 1) exec('insertText', text);
    else exec('insertHTML', lines.map((l, i) => (i === 0 ? escapeHtml(l) : '<div>' + (escapeHtml(l) || '<br>') + '</div>')).join(''));
  }
  normalizePageBreaks();
  markDirty();
}

/* ===== pages.js ===== */
/* 쪽 보기: 글은 하나의 편집 영역에 그대로 두고, 용지(A4) 경계마다
   '아래 여백 + 쪽 사이 + 위 여백' 높이의 띠(float)를 끼워 넣어 줄이 그 구간을 건너뛰게 한다.
   - 문단은 줄 단위로 다음 쪽으로 넘어가고, 짧은 표·그림은 통째로 넘어간다.
   - 한 쪽보다 긴 표는 띠를 빼고 행 단위로 다음 쪽 첫머리에 오도록 간격을 준다.
   - 쪽 나누기는 다음 쪽 첫머리까지 높이를 채운다.
   좌표 단위는 확대/축소와 무관한 CSS px이며, 원점은 첫 쪽 본문 영역의 왼쪽 위다. */
const Pages = (() => {
  const MM = 96 / 25.4;
  const PAGE_H = 297 * MM;
  const MARGIN = (LW.MARGIN_TW / 1440) * 96;
  const GAP = 24;
  const BODY_H = PAGE_H - 2 * MARGIN;   // 한 쪽 본문 높이
  const DEAD = 2 * MARGIN + GAP;        // 쪽 경계 띠 높이
  const PITCH = BODY_H + DEAD;          // = PAGE_H + GAP
  let count = 1;
  let floatSig = '';
  let busy = false;

  const pageOf = (y) => Math.floor((y + 0.01) / PITCH);
  const bodyBottom = (k) => k * PITCH + BODY_H;

  // 화면 좌표(확대/축소 반영) → CSS px 비율. offsetWidth는 정수로 반올림되므로 계산된 폭을 씀
  function scale() {
    const pages = $('pages');
    const w = parseFloat(getComputedStyle(pages).width);
    const r = pages.getBoundingClientRect().width;
    return w && r ? r / w : 1;
  }

  function buildFloats(n, skip) {
    // 건너뛸 경계(skip)는 앞뒤 본문을 하나로 이어 붙인다
    const parts = [];
    let acc = BODY_H;
    for (let k = 0; k < n - 1; k++) {
      if (skip.has(k)) { acc += DEAD + BODY_H; continue; }
      parts.push(acc, -DEAD);
      acc = BODY_H;
    }
    parts.push(acc);
    const sig = parts.map((x) => x.toFixed(2)).join(',');
    if (sig === floatSig) return;
    floatSig = sig;
    $('pgFloats').innerHTML = parts.map((h) => (h > 0 ? `<div class="pg-a" style="height:${h}px"></div>` : `<div class="pg-b" style="height:${-h}px"></div>`)).join('');
  }

  const num = (v) => parseFloat(v) || 0;
  const setVar = (el, name, v) => {
    const cur = num(el.style.getPropertyValue(name));
    if (Math.abs(cur - v) < 0.05) return;
    if (v > 0.05) el.style.setProperty(name, v.toFixed(3) + 'px');
    else {
      el.style.removeProperty(name);
      if (!el.getAttribute('style')) el.removeAttribute('style');
    }
  };
  const rowPad = (tr) => (tr.cells[0] ? num(tr.cells[0].style.getPropertyValue('--pg-pb')) : 0);
  const setRowPad = (tr, v) => { for (const c of tr.cells) setVar(c, '--pg-pb', v); };

  /** 표 배치. 한 쪽보다 긴 표는 행이 쪽 경계에 걸리면 앞 행 아래에 간격을 줘서 다음 쪽 첫머리로 보내고,
      그 표가 지나가는 쪽 경계 띠는 빼 둔다(띠를 피하려고 브라우저가 표를 문서 끝으로 옮기지 않도록).
      이미 준 간격을 빼고 계산하므로 바뀐 값만 다시 쓴다. */
  function layoutTable(t, rel, z, skip) {
    const tRect = t.getBoundingClientRect();
    const rows = Array.from(t.rows).map((r) => {
      const b = r.getBoundingClientRect();
      return { el: r, top: (b.top - tRect.top) / z, h: b.height / z, pad: rowPad(r) };
    });
    let acc = 0;
    for (const r of rows) {
      r.top -= acc;
      r.h -= r.pad;
      acc += r.pad;
    }
    const natH = tRect.height / z - acc;
    if (!rows.length || natH <= BODY_H - 1) {
      // 한 쪽에 들어가는 표는 브라우저가 통째로 다음 쪽으로 넘김
      if (t.hasAttribute('data-pg-tall')) t.removeAttribute('data-pg-tall');
      setVar(t, '--pg-mt', 0);
      rows.forEach((r) => { if (r.pad) setRowPad(r.el, 0); });
      return;
    }
    if (!t.hasAttribute('data-pg-tall')) t.setAttribute('data-pg-tall', ''); // 인쇄할 때도 행 단위로 나뉘게
    // 표가 놓일 원래 위치(띠를 피해 옮겨지기 전의 자리)
    const prev = t.previousElementSibling;
    let top;
    if (prev) top = rel(prev).bottom + Math.max(num(getComputedStyle(prev).marginBottom), 0);
    else top = rel(t.parentElement).top + num(getComputedStyle(t.parentElement).paddingTop);
    let mt = 0;
    const k0 = pageOf(top);
    const first = rows[0];
    if (top >= bodyBottom(k0) - 0.5 || (top + first.top + first.h > bodyBottom(k0) + 0.5 && first.h <= BODY_H)) {
      mt = (k0 + 1) * PITCH - top;
      top += mt;
    }
    setVar(t, '--pg-mt', mt);
    const pads = rows.map(() => 0);
    let shift = 0;
    for (let i = 1; i < rows.length; i++) {
      const r = rows[i];
      const rt = top + r.top + shift;
      const k = pageOf(rt);
      let extra = 0;
      if (rt >= bodyBottom(k) - 0.5) extra = (k + 1) * PITCH - rt;
      else if (rt + r.h > bodyBottom(k) + 0.5 && r.h <= BODY_H) extra = (k + 1) * PITCH - rt;
      if (extra > 0.5) {
        pads[i - 1] = extra;
        shift += extra;
      }
    }
    rows.forEach((r, i) => setRowPad(r.el, pads[i]));
    const bottom = top + natH + shift;
    for (let k = pageOf(top); k <= pageOf(bottom); k++) {
      if (bottom > bodyBottom(k) + 0.5 && top < (k + 1) * PITCH - 0.5) skip.add(k);
    }
  }

  const sameSet = (a, b) => a.size === b.size && [...a].every((x) => b.has(x));
  let lastSkip = new Set();

  function paginate() {
    const ed = App.editor;
    if (!ed || busy || !$('pgFloats')) return;
    busy = true;
    try {
      const z = scale();
      const originEl = $('pgFloats');
      const rel = (el) => {
        const o = originEl.getBoundingClientRect().top;
        const r = el.getBoundingClientRect();
        return { top: (r.top - o) / z, bottom: (r.bottom - o) / z };
      };
      let n = Math.max(1, count);
      let skip = lastSkip;
      for (let iter = 0; iter < 10; iter++) {
        buildFloats(n, skip);
        const next = new Set();
        for (const el of ed.querySelectorAll('.page-break, table')) {
          if (el.classList.contains('page-break')) {
            // 다음 쪽 첫머리까지 채움 (자기 높이와 무관한 윗변 위치로 계산)
            const y = rel(el).top;
            const h = Math.max(0, (pageOf(y) + 1) * PITCH - y);
            if (!(Math.abs(num(el.style.height) - h) < 0.05) || !el.style.height) el.style.height = h.toFixed(3) + 'px';
          } else if (!el.parentElement.closest('table')) {
            layoutTable(el, rel, z, next);
          }
        }
        if (!sameSet(skip, next)) { skip = next; continue; }
        // 마지막 줄이 쪽 아래 여백에 걸치면 한 쪽 더 필요
        const bottom = Math.max(0, rel(ed).bottom - 0.5);
        const kb = pageOf(bottom);
        const need = Math.max(1, kb + 1 + (bottom > bodyBottom(kb) ? 1 : 0));
        if (need === n) break;
        if (need < n) { n = need; buildFloats(n, skip); break; }
        n = need;
      }
      count = n;
      lastSkip = skip;
      drawSheets(n);
    } finally {
      busy = false;
    }
  }

  function drawSheets(n) {
    const sheets = $('sheets');
    if (sheets.children.length !== n) {
      let html = '';
      for (let i = 0; i < n; i++) html += `<div class="sheet"></div>`;
      sheets.innerHTML = html;
      let masks = '';
      for (let k = 0; k < n - 1; k++) masks += `<div class="pg-mask" style="top:${k * PITCH + PAGE_H - MARGIN}px;height:${DEAD}px"></div>`;
      for (let k = 0; k < n; k++) masks += `<div class="pg-num" style="top:${k * PITCH + PAGE_H - MARGIN / 2}px">${k + 1}</div>`;
      $('masks').innerHTML = masks;
    }
    $('pages').style.height = n * PAGE_H + (n - 1) * GAP + 'px';
  }

  let scheduled = false;
  function schedule() {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(() => { scheduled = false; paginate(); });
  }

  /** 커서가 있는 쪽 번호(1부터) */
  function caretPage() {
    const r = currentRange();
    if (!r || !App.editor) return 1;
    let rect = r.getClientRects()[0] || r.getBoundingClientRect();
    if (!rect || (!rect.top && !rect.height)) {
      const el = anchorElement();
      rect = el ? el.getBoundingClientRect() : null;
    }
    if (!rect) return 1;
    const y = (rect.top - $('pgFloats').getBoundingClientRect().top) / scale();
    return Math.min(count, Math.max(1, pageOf(y) + 1));
  }

  /** 입력 뒤에 줄이 다음 쪽으로 밀렸을 때 커서가 화면에 보이도록 */
  function revealCaret() {
    const r = currentRange();
    if (!r) return;
    const rect = r.getClientRects()[0];
    if (!rect) return;
    const ws = $('workspace').getBoundingClientRect();
    if (rect.bottom > ws.bottom - 8) $('workspace').scrollTop += rect.bottom - ws.bottom + 40;
    else if (rect.top < ws.top + 8) $('workspace').scrollTop -= ws.top - rect.top + 40;
  }

  return { paginate, schedule, caretPage, revealCaret, get count() { return count; }, PAGE_W_PX: 210 * MM, BODY_H };
})();

/* ===== app.js ===== */
/* 파일 열기/저장, 대화 상자, 팝업, 찾기, 상태 표시줄, 자동 저장, 초기화 */

// ---------- 알림 ----------
let toastTimer = null;
function toast(msg, ms) {
  const t = $('toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, ms || 2600);
}

// ---------- 대화 상자 ----------
const Dialog = (() => {
  let resolveFn = null;
  let lastFocus = null;
  function open(html, onReady) {
    return new Promise((res) => {
      lastFocus = document.activeElement;
      const d = $('dialog');
      d.innerHTML = html;
      $('overlay').hidden = false;
      resolveFn = (v) => {
        $('overlay').hidden = true;
        resolveFn = null;
        if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
        res(v);
      };
      onReady(d, resolveFn);
      const f = d.querySelector('input:not([type=radio]), input:checked, button.primary');
      if (f) { f.focus(); if (f.select) f.select(); }
    });
  }
  function close(v) { if (resolveFn) resolveFn(v); }
  document.addEventListener('keydown', (e) => {
    if (!resolveFn) return;
    if (e.key === 'Escape') { e.preventDefault(); close(null); }
  }, true);
  $('overlay').addEventListener('mousedown', (e) => { if (e.target === $('overlay')) close(null); });

  return {
    choice(title, msg, buttons) {
      const btns = buttons.map((b, i) => `<button class="btn ${b.primary ? 'primary' : 'outline'}" data-i="${i}">${escapeHtml(b.label)}</button>`).join('');
      return open(`<h2>${escapeHtml(title)}</h2><p>${escapeHtml(msg)}</p><div class="actions">${btns}</div>`, (d, done) => {
        d.querySelectorAll('[data-i]').forEach((b) => b.addEventListener('click', () => done(buttons[+b.dataset.i].value)));
      });
    },
    alert(title, msg) {
      return this.choice(title, msg, [{ label: '확인', value: true, primary: true }]);
    },
    form(opt) {
      const fields = opt.fields.map((f) => `<div class="field"><label for="f_${f.id}">${escapeHtml(f.label)}</label>` +
        `<input id="f_${f.id}" type="${f.type || 'text'}" value="${escapeHtml(f.value || '')}" ${f.min !== undefined ? `min="${f.min}" max="${f.max}"` : ''}></div>`).join('');
      const extra = opt.extra ? `<button class="btn outline" data-x style="margin-right:auto">${escapeHtml(opt.extra.label)}</button>` : '';
      return open(`<h2>${escapeHtml(opt.title)}</h2>${opt.desc ? `<p>${escapeHtml(opt.desc)}</p>` : ''}<form>${fields}` +

        `<div class="opts">${opts}</div><p>이 브라우저에서는 '다운로드' 폴더에 저장됩니다.</p>` +
        '<div class="actions"><button type="button" class="btn outline" data-c>취소</button><button class="btn primary" type="submit">저장</button></div></form>', (d, done) => {
        d.querySelector('form').addEventListener('submit', (e) => {

// ---------- 파일 ----------
function formatFromName(name) {
  const ext = (name.split('.').pop() || '').toLowerCase();
  return { docx: 'docx', doc: 'doc', txt: 'txt' }[ext] || null;
}

function sniff(u8, name) {
  const head = String.fromCharCode.apply(null, u8.subarray(0, 512));
  if (u8[0] === 0x50 && u8[1] === 0x4b) return 'docx';
  if (u8[0] === 0xd0 && u8[1] === 0xcf && u8[2] === 0x11 && u8[3] === 0xe0) return 'doc';
  if (/^\{\\rtf/.test(head)) return 'rtf';
  if (/^MIME-Version:/im.test(head) && /multipart\/related/i.test(head)) return 'mht';
  if (/^\s*(﻿|\xef\xbb\xbf)?\s*<(!doctype|html|\?xml|head|body|meta|div|p[ >])/i.test(head) || /<html[\s>]/i.test(head)) return 'html';
  const ext = (name.split('.').pop() || '').toLowerCase();
  if (ext === 'htm' || ext === 'html') return 'html';
  return 'txt';
}

function textToFragment(text) {
  const frag = document.createDocumentFragment();
  for (const line of text.replace(/\r\n?/g, '\n').split('\n')) {
    const parts = line.split('\f');
    parts.forEach((part, i) => {
      if (i) frag.appendChild(HtmlIO.pageBreak(document));
      if (i && !part) return;
      const p = document.createElement('div');
      if (part) p.textContent = part;
      else p.appendChild(document.createElement('br'));
      frag.appendChild(p);
    });
  }
  return frag;
}

async function importBytes(u8, name) {
  const kind = sniff(u8, name);
  let res;
  if (kind === 'docx') res = await DocxImport.convert(u8, document);
  else if (kind === 'doc') res = DocImport.convert(u8, document);
  else if (kind === 'rtf') res = RtfImport.convert(u8, document);
  else if (kind === 'mht') {
    const html = HtmlIO.mhtToHtml(new TextDecoder('latin1').decode(u8));
    if (!html) throw new Error('MHT 파일을 해석할 수 없습니다.');
    res = { fragment: HtmlIO.sanitize(html, document), stats: {} };
  } else if (kind === 'html') {
    let text = decodeText(u8);
    const cm = text.slice(0, 2048).match(/charset=["']?([\w-]+)/i);
    if (cm && !/utf-?8/i.test(cm[1])) { try { text = new TextDecoder(cm[1]).decode(u8); } catch (e) { /* 그대로 사용 */ } }
    res = { fragment: HtmlIO.sanitize(text, document), stats: {} };
  } else res = { fragment: textToFragment(decodeText(u8)), stats: {} };
  res.kind = kind;
  return res;
}

function withLayoutForExport(fn) {
  const prevZoom = App.zoom;
  if (prevZoom !== 1) $('pages').style.setProperty('--zoom', 1);
  const img = selectedImg;
  if (img) img.classList.remove('sel-img');
  try { return fn(); } finally {
    if (prevZoom !== 1) $('pages').style.setProperty('--zoom', prevZoom);
    if (img && img.isConnected) img.classList.add('sel-img');
  }
}

async function buildBlob(fmt) {
  const title = App.fileName.replace(/\.[^.]+$/, '');
  if (fmt === 'doc') return withLayoutForExport(() => HtmlIO.buildDoc(App.editor, title));
  const model = withLayoutForExport(() => DocModel.extract(App.editor));
  if (fmt === 'txt') return new Blob(['﻿' + DocModel.toText(model)], { type: 'text/plain;charset=utf-8' });
  return DocxExport.build(model, { title });
}

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
}

const SAVED_MSG = {
  docx: '저장했습니다.',
  doc: 'Word 97-2003 호환(.doc) 형식으로 저장했습니다.',
  txt: '텍스트(.txt)로 저장했습니다. 서식은 저장되지 않습니다.',
};

const FileOps = {
  async confirmDiscard() {
    if (!App.dirty) return true;
    const v = await Dialog.choice('저장하지 않은 변경 내용', `'${App.fileName}'의 변경 내용을 저장할까요?`, [
      { label: '취소', value: 'cancel' }, { label: '저장 안 함', value: 'discard' }, { label: '저장', value: 'save', primary: true },
    ]);
    if (v === 'save') { await this.save(); return !App.dirty; }
    return v === 'discard';
  },

  async newDoc() {
    if (!(await this.confirmDiscard())) return;
    createEditor();
    setFile(null, '제목 없음', null, false);
    App.editor.focus();
  },

  async open() {
    if (!(await this.confirmDiscard())) return;
    if (window.showOpenFilePicker) {
      try {
        const [h] = await window.showOpenFilePicker({
          types: [{ description: '문서 (docx, doc, rtf, txt, html)', accept: { 'application/octet-stream': ['.docx', '.doc', '.rtf', '.txt', '.htm', '.html', '.mht', '.mhtml', '.docm', '.dotx', '.dot'] } }],
        });
        await this.load(await h.getFile(), h);
      } catch (e) {
        if (e.name !== 'AbortError') failed('파일을 열지 못했습니다', e);
      }
    } else $('fileInput').click();
  },

  async openFile(file) {
    if (!(await this.confirmDiscard())) return;
    try { await this.load(file, null); } catch (e) { failed('파일을 열지 못했습니다', e); }
  },

  async load(file, handle) {
    const u8 = new Uint8Array(await file.arrayBuffer());
    const res = await importBytes(u8, file.name);
    createEditor(res.fragment);
    const fmt = formatFromName(file.name);
    // docx/txt만 같은 파일에 바로 덮어씀. 그 밖의 형식은 처음 저장할 때 형식을 고르게 함
    const overwrite = !!handle && ((fmt === 'docx' && res.kind === 'docx') || (fmt === 'txt' && res.kind === 'txt'));
    setFile(handle, file.name, fmt, overwrite);
    const skipped = (res.stats && res.stats.skippedImages) || 0;
    let msg = `'${file.name}'을(를) 열었습니다.`;
    if (skipped) msg += ` 표시할 수 없는 그림·개체 ${skipped}개는 제외했습니다.`;
    toast(msg, 3500);
    App.editor.focus({ preventScroll: true });
    $('workspace').scrollTop = 0;
  },

  async save() {
    if (App.fileHandle && App.canOverwrite && App.fileFormat) return this.writeTo(App.fileHandle, App.fileFormat);
    return this.saveAs();
  },

  async saveAs() {
    const base = App.fileName.replace(/\.[^.]+$/, '') || '문서';
    if (window.showSaveFilePicker) {
      let h;
      try {
        h = await window.showSaveFilePicker({
          suggestedName: base + '.docx',
          types: [
            { description: 'Word 문서 (*.docx)', accept: { 'application/vnd.openxmlformats-officedocument.wordprocessingml.document': ['.docx'] } },
            { description: 'Word 97-2003 호환 문서 (*.doc)', accept: { 'application/msword': ['.doc'] } },
            { description: '텍스트 (*.txt)', accept: { 'text/plain': ['.txt'] } },
          ],
          excludeAcceptAllOption: true,
        });
      } catch (e) {
        if (e.name !== 'AbortError') failed('저장하지 못했습니다', e);
        return;
      }
      await this.writeTo(h, formatFromName(h.name) || 'docx');
      return;
    }
    const v = await Dialog.saveAs(base);
    if (!v) return;
    try {
      const blob = await buildBlob(v.format);
      download(blob, v.name + '.' + v.format);
      setFile(null, v.name + '.' + v.format, v.format, false);
      saveDraft();
      toast(SAVED_MSG[v.format] + ' (다운로드 폴더)', 3500);
    } catch (e) { failed('저장하지 못했습니다', e); }
  },

  async writeTo(handle, fmt) {
    try {
      const blob = await buildBlob(fmt);
      const w = await handle.createWritable();
      await w.write(blob);
      await w.close();
      setFile(handle, handle.name, fmt, true);
      saveDraft();
      toast(SAVED_MSG[fmt]);
    } catch (e) {
      failed('저장하지 못했습니다', e);
    }
  },
};

// ---------- 찾기/바꾸기 ----------
const Find = (() => {
  let match = null; // 마지막으로 찾은 위치(Range)
  function index() {
    const nodes = [], starts = [];
    let text = '';
    let prevBlock = null;
    const w = document.createTreeWalker(App.editor, NodeFilter.SHOW_TEXT);
    while (w.nextNode()) {
      const n = w.currentNode;
      const b = blockOf(n);
      if (prevBlock && b !== prevBlock) text += '\n';
      prevBlock = b;
      nodes.push(n);
      starts.push(text.length);
      text += n.data;
    }
    return { nodes, starts, text };
  }
  function locate(ix, pos, isEnd) {
    let lo = 0, hi = ix.nodes.length - 1, k = 0;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (ix.starts[mid] <= pos) { k = mid; lo = mid + 1; } else hi = mid - 1;
    }
    // 끝 위치가 노드 경계면 앞 노드의 끝을 사용
    if (isEnd && k > 0 && ix.starts[k] === pos) k--;
    return { node: ix.nodes[k], offset: pos - ix.starts[k] };
  }
  function norm(s) { return $('findCase').checked ? s : s.toLowerCase(); }
  function selectionPos(ix) {
    const s = getSelection();
    if (!s.rangeCount || !App.editor.contains(s.anchorNode)) return { start: 0, end: 0 };
    const r = s.getRangeAt(0);
    const pos = (node, off) => {
      const i = ix.nodes.indexOf(node);
      if (i >= 0) return ix.starts[i] + off;
      const probe = document.createRange();
      probe.setStart(node, off);
      for (let k = 0; k < ix.nodes.length; k++) if (probe.comparePoint(ix.nodes[k], 0) >= 0) return ix.starts[k];
      return ix.text.length;
    };
    return { start: pos(r.startContainer, r.startOffset), end: pos(r.endContainer, r.endOffset) };
  }
  function select(ix, at, len) {
    const a = locate(ix, at, false), b = locate(ix, at + len, true);
    const r = document.createRange();
    r.setStart(a.node, a.offset);
    r.setEnd(b.node, b.offset);
    const s = getSelection();
    s.removeAllRanges();
    s.addRange(r);
    App.savedRange = r.cloneRange();
    match = r.cloneRange();
    const rect = r.getBoundingClientRect();
    const ws = $('workspace');
    const wr = ws.getBoundingClientRect();
    if (rect.top < wr.top + 20 || rect.bottom > wr.bottom - 20) ws.scrollTop += rect.top - wr.top - wr.height / 3;
  }
  function count(ix, needle) {
    if (!needle) return 0;
    const hay = norm(ix.text), nd = norm(needle);
    let c = 0;
    for (let i = hay.indexOf(nd); i >= 0; i = hay.indexOf(nd, i + nd.length)) c++;
    return c;
  }
  function find(back) {
    const needle = $('findText').value;
    if (!needle || /\n/.test(needle)) { $('findInfo').textContent = ''; return false; }
    const ix = index();
    const hay = norm(ix.text), nd = norm(needle);
    const sp = selectionPos(ix);
    let at = back ? hay.lastIndexOf(nd, sp.start - 1) : hay.indexOf(nd, sp.end > sp.start ? sp.end : sp.start);
    if (at < 0) at = back ? hay.lastIndexOf(nd) : hay.indexOf(nd);
    const total = count(ix, needle);
    if (at < 0) { $('findInfo').textContent = '찾을 수 없음'; return false; }
    select(ix, at, needle.length);
    let k = 0;
    for (let i = hay.indexOf(nd); i >= 0 && i <= at; i = hay.indexOf(nd, i + nd.length)) k++;
    $('findInfo').textContent = `${k} / ${total}`;
    return true;
  }
  function matchStillValid() {
    const needle = $('findText').value;
    return match && needle && App.editor.contains(match.startContainer) && norm(match.toString()) === norm(needle);
  }
  function replaceOne() {
    if (!matchStillValid()) { find(false); return; }
    App.editor.focus({ preventScroll: true });
    const s = getSelection();
    s.removeAllRanges();
    s.addRange(match);
    const rep = $('replaceText').value;
    if (rep) exec('insertText', rep); else exec('delete');
    markDirty();
    find(false);
    $('replaceText').focus();
  }
  function replaceAll() {
    const needle = $('findText').value;
    if (!needle) return;
    const rep = $('replaceText').value;
    let n = 0;
    App.editor.focus({ preventScroll: true });
    let from = 0;
    while (n < 10000) {
      const ix = index();
      const at = norm(ix.text).indexOf(norm(needle), from);
      if (at < 0) break;
      select(ix, at, needle.length);
      if (rep) exec('insertText', rep); else exec('delete');
      from = at + rep.length;
      n++;
    }
    if (n) markDirty();
    $('findInfo').textContent = n ? `${n}개 바꿈` : '찾을 수 없음';
    toast(n ? `${n}개를 바꿨습니다.` : '찾을 내용이 없습니다.');
  }
  return {
    open(replace) {
      $('findBar').hidden = false;
      const s = getSelection().toString();
      if (s && s.length < 80 && !/\n/.test(s)) $('findText').value = s;
      const f = replace ? $('replaceText') : $('findText');
      f.focus();
      f.select();
    },
    close() {
      $('findBar').hidden = true;
      $('findInfo').textContent = '';
      focusEditor();
    },
    find, replaceOne, replaceAll,
  };
})();

// ---------- 실행기(Geulbang.exe)로 넘겨받은 문서 열기 ----------
// 탐색기의 '연결 프로그램'으로 열면 실행기가 주소 끝에 #open=<문서 경로>를 붙여 줍니다.
function pathToFileUrl(p) {
  const parts = p.replace(/\\/g, '/').split('/');
  if (p.startsWith('\\\\') || p.startsWith('//')) {
    return 'file://' + parts.slice(2).map((s, i) => (i === 0 ? s : encodeURIComponent(s))).join('/');
  }
  if (p.startsWith('/')) return 'file://' + parts.map(encodeURIComponent).join('/');
  return 'file:///' + parts.map((s, i) => (i === 0 && /^[a-zA-Z]:$/.test(s) ? s : encodeURIComponent(s))).join('/');
}

function readLocalFile(url) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open('GET', url);
    x.responseType = 'arraybuffer';
    x.onload = () => (x.status === 0 || x.status === 200) && x.response ? resolve(new Uint8Array(x.response)) : reject(new Error('읽기 실패'));
    x.onerror = () => reject(new Error('읽기 실패'));
    try { x.send(); } catch (e) { reject(e); }
  });
}

async function openFromLaunch(path) {
  const name = path.split(/[\\/]/).pop() || '문서';
  try {
    const bytes = await readLocalFile(pathToFileUrl(path));
    await FileOps.load(new File([bytes], name), null);
  } catch (e) {
    Dialog.alert('파일을 열지 못했습니다', `'${name}'을(를) 바로 열 수 없습니다. [열기] 단추로 파일을 선택해 주세요.`);
  }
}

function launchRequest() {
  const m = /^#open=(.+)$/.exec(location.hash);
  if (!m) return null;
  history.replaceState(null, '', location.pathname + location.search);
  try { return decodeURIComponent(m[1]); } catch (e) { return null; }
}

// ---------- 초기화 ----------
function init() {
  // 제목 스타일 CSS (docx 저장값과 동일)
  const st = document.createElement('style');
  st.textContent = LW.HEADINGS.map((h, i) => `.editor h${i + 1}{font-size:${h.sizePt}pt;margin:${h.beforePt}pt 0 ${h.afterPt}pt}`).join('\n');
  document.head.appendChild(st);

  const fontSel = $('selFont');
  for (const f of FONTS) {
    const o = document.createElement('option');
    o.value = f.name;
    o.textContent = f.name;
    o.style.fontFamily = cssFontStack([f.name]);
    fontSel.appendChild(o);
  }
  const sizeSel = $('selSize');
  for (const s of [8, 9, 10, 10.5, 11, 12, 14, 16, 18, 20, 22, 24, 28, 32, 36, 48, 72]) {
    const o = document.createElement('option');
    o.value = String(s);
    o.textContent = String(s);
    sizeSel.appendChild(o);
  }
  buildSwatches();
  buildTableGrid();

  document.querySelectorAll('[data-cmd]').forEach((b) => {
    b.addEventListener('mousedown', (e) => e.preventDefault());
    b.addEventListener('click', () => { Popups.hideAll(); runCommand(b.dataset.cmd); });
  });
  document.querySelectorAll('[data-pop]').forEach((b) => {
    b.addEventListener('mousedown', (e) => e.preventDefault());
    b.addEventListener('click', () => Popups.toggle(b.dataset.pop, b.closest('.drop') || b));
  });
  document.querySelectorAll('[data-imgw]').forEach((b) => {
    b.addEventListener('mousedown', (e) => e.preventDefault());
    b.addEventListener('click', () => resizeImage(+b.dataset.imgw));
  });
  $('selStyle').addEventListener('change', (e) => applyBlockStyle(e.target.value));
  $('selFont').addEventListener('change', (e) => applyFont(e.target.value));
  $('selSize').addEventListener('change', (e) => applySize(parseFloat(e.target.value)));
  $('selLine').addEventListener('change', (e) => applyLineSpacing(parseFloat(e.target.value)));

  $('fileInput').addEventListener('change', async (e) => {
    const f = e.target.files[0];
    e.target.value = '';
    if (f) { try { await FileOps.load(f, null); } catch (err) { failed('파일을 열지 못했습니다', err); } }
  });
  $('imageInput').addEventListener('change', (e) => {
    const files = Array.from(e.target.files);
    e.target.value = '';
    insertImageFiles(files);
  });

  $('findNext').addEventListener('click', () => Find.find(false));
  $('findPrev').addEventListener('click', () => Find.find(true));
  $('replaceOne').addEventListener('click', () => Find.replaceOne());
  $('replaceAll').addEventListener('click', () => Find.replaceAll());
  $('findClose').addEventListener('click', () => Find.close());
  $('findText').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); Find.find(e.shiftKey); }
    if (e.key === 'Escape') { e.preventDefault(); Find.close(); }
  });
  $('replaceText').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); Find.replaceOne(); }
    if (e.key === 'Escape') { e.preventDefault(); Find.close(); }
  });

  $('zoomIn').addEventListener('click', () => setZoom(Math.round(App.zoom * 10 + 1) / 10));
  $('zoomOut').addEventListener('click', () => setZoom(Math.round(App.zoom * 10 - 1) / 10));
  let z = 0;
  try { z = parseFloat(localStorage.getItem('geulbang.zoom')) || 0; } catch (e) { /* 무시 */ }
  if (z) setZoom(z); else setZoom(1, true);
  fitZoom();
  window.addEventListener('resize', fitZoom);

  // 여백이나 본문 아래 빈 곳을 눌러도 가까운 줄로 커서 이동
  $('pages').addEventListener('mousedown', (e) => {
    if (!App.editor || App.editor.contains(e.target) || e.button !== 0) return;
    e.preventDefault();
    const er = App.editor.getBoundingClientRect();
    const x = Math.min(Math.max(e.clientX, er.left + 2), er.right - 2);
    const r = document.caretRangeFromPoint ? document.caretRangeFromPoint(x, e.clientY) : null;
    App.editor.focus({ preventScroll: true });
    const s = getSelection();
    s.removeAllRanges();
    if (r && App.editor.contains(r.startContainer)) s.addRange(r);
    else placeCaret(App.editor.lastElementChild || App.editor, true);
  });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => Pages.paginate());

  document.addEventListener('selectionchange', () => {
    const s = getSelection();
    if (App.editor && s.rangeCount && App.editor.contains(s.anchorNode)) {
      App.savedRange = s.getRangeAt(0).cloneRange();
      scheduleToolbar();
      schedulePageStatus();
    }
  });
  document.addEventListener('mousedown', (e) => {
    if (Popups.open && !e.target.closest('.popup') && !e.target.closest('[data-pop]')) Popups.hideAll();
    if (selectedImg && !e.target.closest('#popImg') && e.target !== selectedImg) selectImage(null);
  });
  $('workspace').addEventListener('scroll', () => { if (selectedImg) selectImage(selectedImg); }, { passive: true });

  document.addEventListener('keydown', (e) => {
    if ($('overlay').hidden === false) return;
    const mod = e.ctrlKey || e.metaKey;
    const k = e.key.toLowerCase();
    if (e.key === 'Escape') { Popups.hideAll(); if (!$('findBar').hidden) Find.close(); return; }
    if (!mod || e.altKey) return;
    const inEditor = App.editor && App.editor.contains(document.activeElement);
    const map = {
      s: () => (e.shiftKey ? FileOps.saveAs() : FileOps.save()),
      o: () => FileOps.open(),
      f: () => Find.open(false),
      h: () => Find.open(true),
      k: () => editLink(),
      p: () => window.print(),
    };
    if (inEditor) Object.assign(map, {
      l: () => runCommand('justifyLeft'), e: () => runCommand('justifyCenter'),
      r: () => runCommand('justifyRight'), j: () => runCommand('justifyFull'),
    });
    if (e.shiftKey && k !== 's') return;
    if (map[k]) { e.preventDefault(); map[k](); }
  });

  // 창 전체에 파일 끌어 놓기
  let dragDepth = 0;
  window.addEventListener('dragenter', (e) => {
    if (e.dataTransfer && Array.from(e.dataTransfer.types).includes('Files')) { dragDepth++; document.body.classList.add('dropzone'); }
  });
  window.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dropzone'); } });
  window.addEventListener('dragover', (e) => { if (e.dataTransfer && Array.from(e.dataTransfer.types).includes('Files')) e.preventDefault(); });
  window.addEventListener('drop', (e) => {
    dragDepth = 0;
    document.body.classList.remove('dropzone');
    const f = e.dataTransfer && e.dataTransfer.files[0];
    if (!f) return;
    e.preventDefault();
    FileOps.openFile(f);
  });

  window.addEventListener('beforeunload', (e) => {
    if (App.dirty) { saveDraft(); e.preventDefault(); e.returnValue = ''; }
  });

  createEditor();
  setFile(null, '제목 없음', null, false);
  const launchPath = launchRequest();
  const draft = launchPath ? null : loadDraft();
  if (launchPath) openFromLaunch(launchPath);
  if (draft) {
    const when = new Date(draft.t).toLocaleString('ko-KR');
    Dialog.choice('문서 복구', `저장하지 않고 닫힌 문서가 있습니다 (${draft.name}, ${when}). 복구할까요?`, [
      { label: '버리기', value: false }, { label: '복구', value: true, primary: true },
    ]).then((ok) => {
      if (ok) {
        createEditor(HtmlIO.sanitize(draft.html, document, { keepWhitespace: true }));
        setFile(null, draft.name, null, false);
        App.dirty = true;
        updateTitle();
      } else {
        try { localStorage.removeItem(DRAFT_KEY); } catch (e) { /* 무시 */ }
      }
    });
  }
  App.editor.focus();
  updateToolbar();
  if (!window.showSaveFilePicker) $('stSaved').title = '이 브라우저는 파일 직접 저장을 지원하지 않아 다운로드 폴더에 저장합니다. Chrome 또는 Edge를 권장합니다.';
}

init();

</script>
