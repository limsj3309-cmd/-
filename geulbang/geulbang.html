<style>
:root {
  --bg: #e9ebef;
  --chrome: #f8f9fb;
  --chrome-2: #ffffff;
  --border: #d5d9e0;
  --text: #1f2328;
  --muted: #626a75;
  --accent: #2563eb;
  --accent-soft: #dbe6fd;
  --hover: #eceff4;
  --danger: #c4314b;
  --brand: #c4502a;
  --shadow: 0 1px 3px rgba(0, 0, 0, .12), 0 4px 14px rgba(0, 0, 0, .06);
  --ui-font: "맑은 고딕", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d2026; --chrome: #262a31; --chrome-2: #2d323a; --border: #3a404a; --text: #e6e8eb; --muted: #9aa3ae;
    --accent: #6c9cff; --accent-soft: #2c3b5c; --hover: #343a44; --danger: #ff6b81; --brand: #f08a62; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1d2026; --chrome: #262a31; --chrome-2: #2d323a; --border: #3a404a; --text: #e6e8eb; --muted: #9aa3ae;
  --accent: #6c9cff; --accent-soft: #2c3b5c; --hover: #343a44; --danger: #ff6b81; --brand: #f08a62; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 13px/1.4 var(--ui-font); overflow: hidden; }
#app { display: flex; flex-direction: column; height: 100%; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* 상단 파일 줄 */
.titlebar { display: flex; align-items: center; gap: 4px; padding: 6px 10px; background: var(--chrome-2); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.brand { font-weight: 700; color: var(--brand); margin-right: 8px; letter-spacing: .2px; display: flex; align-items: center; gap: 6px; }
.docname { margin-left: auto; color: var(--muted); max-width: 40vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.docname b { color: var(--text); font-weight: 600; }
.dirty::after { content: " ●"; color: var(--danger); }

/* 버튼 공통 */
.btn { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 8px; border: 1px solid transparent; border-radius: 6px;
  background: transparent; color: var(--text); font: inherit; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn.on { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.btn.icon { width: 30px; padding: 0; justify-content: center; }
.btn.primary { background: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.outline { border-color: var(--border); background: var(--chrome-2); }
.btn .lbl { font-size: 13px; }
.btn .txt-ico { font-weight: 700; font-size: 15px; width: 18px; text-align: center; font-family: Georgia, "Times New Roman", serif; }

/* 서식 도구 모음 */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; padding: 5px 8px; background: var(--chrome); border-bottom: 1px solid var(--border); }
.sep { width: 1px; height: 22px; background: var(--border); margin: 0 5px; }
.toolbar select { height: 30px; border: 1px solid var(--border); border-radius: 6px; background: var(--chrome-2); color: var(--text); font: inherit; padding: 0 4px; }
#selStyle { width: 92px; } #selFont { width: 128px; } #selSize { width: 62px; } #selLine { width: 70px; }
.color-btn { position: relative; }
.color-btn .bar { position: absolute; left: 7px; right: 7px; bottom: 4px; height: 3px; border-radius: 2px; }
.drop { position: relative; display: inline-flex; }
.drop .caret { width: 14px; padding: 0; justify-content: center; margin-left: -2px; }
.caret svg.i { width: 12px; height: 12px; }

/* 팝업(색상표, 표 크기 등) */
.popup { position: fixed; z-index: 50; background: var(--chrome-2); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); padding: 8px; }
.popup[hidden] { display: none; }
.swatches { display: grid; grid-template-columns: repeat(8, 20px); gap: 4px; }
.swatch { width: 20px; height: 20px; border-radius: 4px; border: 1px solid rgba(0, 0, 0, .15); cursor: pointer; padding: 0; }
.swatch:hover { transform: scale(1.12); }
.popup .wide { width: 100%; margin-top: 6px; justify-content: center; }
.tgrid { display: grid; grid-template-columns: repeat(10, 16px); gap: 2px; }
.tgrid span { width: 16px; height: 16px; border: 1px solid var(--border); border-radius: 2px; background: var(--chrome-2); }
.tgrid span.hl { background: var(--accent-soft); border-color: var(--accent); }
.tlabel { text-align: center; margin-top: 6px; color: var(--muted); }
.menu { display: flex; flex-direction: column; min-width: 180px; padding: 4px; }
.menu .btn { justify-content: flex-start; width: 100%; }
.menu hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; width: 100%; }

/* 찾기/바꾸기 */
.findbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 10px; background: var(--chrome); border-bottom: 1px solid var(--border); }
.findbar[hidden] { display: none; }
.findbar input[type=text] { height: 28px; width: 180px; border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; background: var(--chrome-2); color: var(--text); font: inherit; }
.findbar label { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); }
#findInfo { color: var(--muted); min-width: 60px; }

/* 작업 영역과 종이 */
.workspace { flex: 1; overflow: auto; padding: 24px 16px 48px; }
/* 쪽 보기: 용지(.sheet)는 뒤에, 글(.page)은 가운데, 쪽 경계 가림막(.masks)은 위에 */
.pages { position: relative; width: 210mm; height: 297mm; margin: 0 auto; zoom: var(--zoom, 1); }
.sheets { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
.sheet { height: 297mm; margin-bottom: 24px; background: #fff; box-shadow: var(--shadow); }
.page { position: relative; z-index: 1; display: flow-root; padding: 25.4mm; color: #000; }
.pg-floats > div { float: left; clear: left; }
.pg-floats > .pg-a { width: 0; }
.pg-floats > .pg-b { width: 100%; }
.masks { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.pg-mask { position: absolute; left: 0; right: 0;
  background: linear-gradient(to bottom, #fff 0 25.4mm, var(--bg) 25.4mm calc(25.4mm + 24px), #fff calc(25.4mm + 24px) 100%); }
.pg-num { position: absolute; left: 0; right: 0; text-align: center; transform: translateY(-50%); color: #8a929c; font: 11px var(--ui-font); }
@property --pg-mt { syntax: '<length>'; inherits: false; initial-value: 0px; }
@property --pg-pb { syntax: '<length>'; inherits: false; initial-value: 0px; }
.editor { outline: none; white-space: pre-wrap; overflow-wrap: break-word; tab-size: 48px; -moz-tab-size: 48px;
  font-family: "맑은 고딕", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", "Noto Sans CJK KR", sans-serif;
  font-size: 11pt; line-height: 1.38; color: #000; caret-color: #000; }
.editor p, .editor div { margin: 0 0 6pt; }
.editor div:has(> ul, > ol, > table, > div, > p, > h1, > h2, > h3, > h4, > h5, > h6, > blockquote) { margin: 0; }
.editor li > div, .editor li > p { margin: 0; }
.editor h1, .editor h2, .editor h3, .editor h4, .editor h5, .editor h6 { font-weight: 700; }
.editor ul, .editor ol { margin: 0 0 6pt; padding-left: 48px; }
.editor li { margin: 0; }
.editor li > ul, .editor li > ol, .editor ul ul, .editor ol ol, .editor ul ol, .editor ol ul { margin: 0; }
.editor ul { list-style-type: disc; } .editor ul ul { list-style-type: circle; } .editor ul ul ul { list-style-type: square; }
.editor ol { list-style-type: decimal; } .editor ol ol { list-style-type: lower-alpha; } .editor ol ol ol { list-style-type: lower-roman; }
.editor ol ol ol ol { list-style-type: decimal; }
.editor table { border-collapse: collapse; width: 100%; margin: var(--pg-mt, 0px) 0 6pt; table-layout: fixed; }
.editor td, .editor th { border: 1px solid #000; padding: 2px 7px calc(2px + var(--pg-pb, 0px)); vertical-align: top; min-width: 20px; }
.editor td p, .editor th p, .editor td div, .editor th div { margin: 0; }
.editor td.cell-sel, .editor th.cell-sel { background-color: rgba(37, 99, 235, .08); }
.editor img { max-width: 100%; max-height: calc(297mm - 50.8mm - 4px); height: auto; object-fit: contain; vertical-align: bottom; }
.editor img.sel-img { outline: 2px solid #2563eb; outline-offset: 1px; }
.editor a { color: #0563c1; text-decoration: underline; }
.editor blockquote { margin: 0 0 0 40px; padding: 0; border: none; }
.editor .page-break { position: relative; height: 0; border-top: 1px dashed #9aa3ae; margin: 0; user-select: none; cursor: default; }
.editor .page-break::after { content: "쪽 나누기"; position: absolute; left: 50%; top: 6px; transform: translateX(-50%); background: #fff; color: #7a828d; font-size: 11px; padding: 0 8px; font-family: var(--ui-font); }
.editor mark.find-hit { background: #ffe58a; color: inherit; }

/* 그림 크기 조절 도구 */
#imgTools { display: flex; gap: 2px; padding: 4px; }

/* 상태 표시줄 */
.statusbar { display: flex; align-items: center; gap: 14px; padding: 4px 12px; background: var(--chrome-2); border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; flex-wrap: wrap; }
.statusbar .grow { flex: 1; }
.zoom { display: inline-flex; align-items: center; gap: 2px; }
.zoom .btn { height: 22px; width: 22px; }
#zoomVal { min-width: 40px; text-align: center; }

/* 대화 상자 */
.overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .35); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
.overlay[hidden] { display: none; }
.dialog { background: var(--chrome-2); color: var(--text); border-radius: 10px; box-shadow: var(--shadow); width: min(440px, 100%); padding: 18px 20px; }
.dialog h2 { margin: 0 0 10px; font-size: 16px; }
.dialog p { margin: 0 0 10px; color: var(--muted); line-height: 1.5; }
.dialog .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.dialog input[type=text], .dialog input[type=number], .dialog input[type=url] { height: 32px; border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; background: var(--chrome); color: var(--text); font: inherit; }
.dialog .opts { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.dialog .opts label { display: flex; gap: 8px; align-items: flex-start; padding: 8px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }
.dialog .opts label small { display: block; color: var(--muted); }
.dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }

#toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); background: #222; color: #fff; padding: 8px 14px; border-radius: 8px; z-index: 200; box-shadow: var(--shadow); max-width: 90vw; }
#toast[hidden] { display: none; }
.dropzone::after { content: "여기에 놓아서 열기"; position: fixed; inset: 10px; border: 3px dashed var(--accent); border-radius: 12px; display: flex; align-items: center; justify-content: center;
  font-size: 22px; color: var(--accent); background: rgba(37, 99, 235, .06); pointer-events: none; z-index: 90; }

@media (max-width: 860px) {
  .workspace { padding: 12px 0 32px; }
  .btn .lbl { display: none; }
  .docname { max-width: 100%; margin-left: 0; width: 100%; order: 10; }
}

@media print {
  @page { size: A4; margin: 25.4mm; }
  body { background: #fff; overflow: visible; height: auto; }
  #app { display: block; height: auto; }
  .titlebar, .toolbar, .findbar, .statusbar, .popup, .overlay, #toast { display: none !important; }
  .workspace { overflow: visible; padding: 0; }
  .pages { width: auto; height: auto !important; zoom: 1; }
  .sheets, .masks, .pg-floats { display: none !important; }
  .page { display: block; padding: 0; }
  .editor { orphans: 1; widows: 1; }
  .editor table { --pg-mt: 0px !important; }
  .editor table:not([data-pg-tall]) { break-inside: avoid; }
  .editor td, .editor th { --pg-pb: 0px !important; }
  .editor tr { break-inside: avoid; }
  .editor .page-break { height: 0 !important; border: 0; margin: 0; break-after: page; page-break-after: always; }
  .editor .page-break::after { display: none; }
  .editor img.sel-img { outline: none; }
}

</style>
</head>

  { name: 'Courier New', aliases: [], kind: 'mono' },
];

const FALLBACK_FONTS = {
  sans: ['Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'sans-serif'],
  serif: ['AppleMyungjo', 'Noto Serif KR', 'Noto Serif CJK KR', 'serif'],
  mono: ['monospace'],
};
const FALLBACK_SET = new Set(
  [].concat(...Object.values(FALLBACK_FONTS), ['sans-serif', 'serif', 'monospace', 'system-ui', 'cursive', 'fantasy'])
    .map((s) => s.toLowerCase())
);

const FONT_ALIAS = (() => {
  const m = new Map();
  for (const f of FONTS) {
    m.set(f.name.toLowerCase(), f);
    for (const a of f.aliases) m.set(a.toLowerCase(), f);
  }
  return m;
})();

function canonicalFont(name) {
  const f = FONT_ALIAS.get(String(name).trim().toLowerCase());
  return f ? f.name : String(name).trim();
}

function quoteFont(n) {
  return /^[a-z-]+$/i.test(n) && FALLBACK_SET.has(n.toLowerCase()) ? n : '"' + n.replace(/"/g, '') + '"';
}

/** 글꼴 이름(들) → CSS font-family. names[0]=라틴 글꼴, names[1]=한글(동아시아) 글꼴 */
function cssFontStack(names) {
  const out = [];
  const seen = new Set();
  let kind = 'sans';
  const add = (n) => {
    if (!n || seen.has(n.toLowerCase())) return;
    seen.add(n.toLowerCase());
    out.push(n);
  };
  names.filter(Boolean).forEach((n, i) => {
    const f = FONT_ALIAS.get(n.toLowerCase());
    if (f) {
      add(f.name);
      f.aliases.forEach(add);
      if (i === 0) kind = f.kind;
    } else {
      add(n);
      if (i === 0 && /serif|myeongjo|명조|바탕|times|batang|mincho|song/i.test(n) && !/sans/i.test(n)) kind = 'serif';
    }
  });
  FALLBACK_FONTS[kind].forEach(add);
  return out.map(quoteFont).join(', ');
}

/** CSS font-family 문자열 → { ascii, eastAsia } */
function parseFontStack(css) {
  const list = String(css || '')
    .split(',')
    .map((s) => s.trim().replace(/^["']|["']$/g, '').trim())
    .filter((s) => s && !FALLBACK_SET.has(s.toLowerCase()))
    .map(canonicalFont);
  const uniq = [...new Set(list)];
  const ascii = uniq[0] || LW.DEFAULT_FONT;
  // 한글 글꼴이 지정된 경우에만 동아시아 글꼴로 씀 (없으면 문서 기본 한글 글꼴을 따름)
  return { ascii, eastAsia: uniq.find(isKoreanFont) || null };
}

function isKoreanFont(name) {
  const f = FONT_ALIAS.get(String(name).toLowerCase());
  return f ? !!f.ko : /[\uac00-\ud7a3]|myeongjo|batang|gulim|dotum|gungsuh|nanum|malgun|hangul|apple sd gothic|\bkr\b/i.test(name);
}

const HIGHLIGHTS = {
  yellow: 'FFFF00', green: '00FF00', cyan: '00FFFF', magenta: 'FF00FF', blue: '0000FF', red: 'FF0000',
  darkBlue: '000080', darkCyan: '008080', darkGreen: '008000', darkMagenta: '800080', darkRed: '800000',
  darkYellow: '808000', darkGray: '808080', lightGray: 'C0C0C0', black: '000000', white: 'FFFFFF',
};
const HIGHLIGHT_BY_HEX = Object.fromEntries(Object.entries(HIGHLIGHTS).map(([k, v]) => [v, k]));

/** Word 97 색 번호(ico) */
const ICO_COLORS = [null, '000000', '0000FF', '00FFFF', '00FF00', 'FF00FF', 'FF0000', 'FFFF00', 'FFFFFF',
  '000080', '008080', '008000', '800080', '800000', '808000', '808080', 'C0C0C0'];

/** 'rgb(1, 2, 3)' / '#abc' → 'RRGGBB' (투명이면 null) */
function cssColorToHex(c) {
  if (!c) return null;
  c = String(c).trim();
  let m = c.match(/^rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)(?:[,\s/]+([\d.]+%?))?\s*\)$/i);
  if (m) {
    if (m[4] !== undefined && parseFloat(m[4]) === 0) return null;
    return [m[1], m[2], m[3]].map((v) => (+v).toString(16).padStart(2, '0')).join('').toUpperCase();
  }
  m = c.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
  if (m) {
    let h = m[1];
    if (h.length === 3) h = h.split('').map((x) => x + x).join('');
    return h.toUpperCase();
  }
  return null;
}

function escapeXml(s) {
  return String(s)
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F￾￿]/g, '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
const escapeHtml = escapeXml;

function bytesToBase64(u8) {
  let s = '';
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s);
}

function base64ToBytes(b64) {
  const s = atob(b64);
  const u8 = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) u8[i] = s.charCodeAt(i);
  return u8;
}

const IMAGE_MIME = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', bmp: 'image/bmp', webp: 'image/webp', svg: 'image/svg+xml' };

/** 바이트의 서명으로 이미지 형식 추정 */
function sniffImage(u8) {
  if (u8[0] === 0x89 && u8[1] === 0x50) return 'png';
  if (u8[0] === 0xff && u8[1] === 0xd8) return 'jpeg';
  if (u8[0] === 0x47 && u8[1] === 0x49) return 'gif';
  if (u8[0] === 0x42 && u8[1] === 0x4d) return 'bmp';
  if (u8[8] === 0x57 && u8[9] === 0x45 && u8[10] === 0x42 && u8[11] === 0x50) return 'webp';
  return null;
}

/** 텍스트 파일 디코딩: BOM → UTF-8 → EUC-KR(CP949) 순으로 시도 */
function decodeText(u8) {
  if (u8[0] === 0xef && u8[1] === 0xbb && u8[2] === 0xbf) return new TextDecoder('utf-8').decode(u8.subarray(3));
  if (u8[0] === 0xff && u8[1] === 0xfe) return new TextDecoder('utf-16le').decode(u8.subarray(2));
  if (u8[0] === 0xfe && u8[1] === 0xff) return new TextDecoder('utf-16be').decode(u8.subarray(2));
  try {
    return new TextDecoder('utf-8', { fatal: true }).decode(u8);
  } catch (e) {
    return new TextDecoder('euc-kr').decode(u8);
  }
}

/* ===== zip.js ===== */
/* ZIP 읽기/쓰기 (docx 컨테이너용). 외부 라이브러리 없이 브라우저 내장 압축 API 사용. */
const Zip = (() => {
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();

  function crc32(bytes) {
    let c = 0xffffffff;
    for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
    return (c ^ 0xffffffff) >>> 0;
  }

  async function pipe(bytes, stream) {
    const out = new Blob([bytes]).stream().pipeThrough(stream);
    return new Uint8Array(await new Response(out).arrayBuffer());
  }

  async function inflateRaw(data, crc, size) {
    try {
      return await pipe(data, new DecompressionStream('deflate-raw'));
    } catch (e) {
      // 구형 브라우저: raw deflate 데이터를 gzip 컨테이너로 감싸서 해제
      const gz = new Uint8Array(10 + data.length + 8);
      gz.set([0x1f, 0x8b, 8, 0, 0, 0, 0, 0, 0, 0xff]);
      gz.set(data, 10);
      const dv = new DataView(gz.buffer);
      dv.setUint32(10 + data.length, crc, true);
      dv.setUint32(14 + data.length, size >>> 0, true);
      return await pipe(gz, new DecompressionStream('gzip'));
    }
  }

  async function deflateRaw(data) {
    try {
      return await pipe(data, new CompressionStream('deflate-raw'));
    } catch (e) {
      try {
        const gz = await pipe(data, new CompressionStream('gzip'));
        return gz.subarray(10, gz.length - 8);
      } catch (e2) {
        return null; // 압축 불가 → 무압축 저장
      }
    }
  }

  /** ZIP 바이트를 읽어 { 경로: () => Promise<Uint8Array> } 형태의 맵을 반환 */
  function read(buf) {
    const u8 = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
    const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    let eocd = -1;
    for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('ZIP 형식이 아닙니다.');
    const count = dv.getUint16(eocd + 10, true);
    let p = dv.getUint32(eocd + 16, true);
    const entries = {};
    const utf8 = new TextDecoder('utf-8');
    for (let n = 0; n < count; n++) {
      if (dv.getUint32(p, true) !== 0x02014b50) break;
      const method = dv.getUint16(p + 10, true);
      const crc = dv.getUint32(p + 16, true);
      const csize = dv.getUint32(p + 20, true);
      const usize = dv.getUint32(p + 24, true);
      const nameLen = dv.getUint16(p + 28, true);
      const extraLen = dv.getUint16(p + 30, true);
      const commentLen = dv.getUint16(p + 32, true);
      const local = dv.getUint32(p + 42, true);
      const name = utf8.decode(u8.subarray(p + 46, p + 46 + nameLen)).replace(/\\/g, '/');
      p += 46 + nameLen + extraLen + commentLen;
      const lNameLen = dv.getUint16(local + 26, true);
      const lExtraLen = dv.getUint16(local + 28, true);
      const start = local + 30 + lNameLen + lExtraLen;
      const data = u8.subarray(start, start + csize);
      entries[name] = async () => {
        if (method === 0) return data;
        if (method === 8) return inflateRaw(data, crc, usize);
        throw new Error('지원하지 않는 압축 방식: ' + method);
      };
    }
    return entries;
  }

  /** files: [{ name, data: Uint8Array|string }] → ZIP Blob */
  async function write(files, mime) {
    const enc = new TextEncoder();
    const parts = [];
    const central = [];
    let offset = 0;
    const now = new Date();
    const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
    const dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
    for (const f of files) {
      const raw = typeof f.data === 'string' ? enc.encode(f.data) : f.data;
      const name = enc.encode(f.name);
      const crc = crc32(raw);
      let body = raw.length > 64 ? await deflateRaw(raw) : null;
      let method = 8;
      if (!body || body.length >= raw.length) { body = raw; method = 0; }
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true);
      lh.setUint16(4, 20, true);
      lh.setUint16(6, 0x0800, true);
      lh.setUint16(8, method, true);
      lh.setUint16(10, dosTime, true);
      lh.setUint16(12, dosDate, true);
      lh.setUint32(14, crc, true);
      lh.setUint32(18, body.length, true);
      lh.setUint32(22, raw.length, true);
      lh.setUint16(26, name.length, true);
      parts.push(new Uint8Array(lh.buffer), name, body);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true);
      ch.setUint16(4, 20, true);
      ch.setUint16(6, 20, true);
      ch.setUint16(8, 0x0800, true);
      ch.setUint16(10, method, true);
      ch.setUint16(12, dosTime, true);
      ch.setUint16(14, dosDate, true);
      ch.setUint32(16, crc, true);
      ch.setUint32(20, body.length, true);
      ch.setUint32(24, raw.length, true);
      ch.setUint16(28, name.length, true);
      ch.setUint32(42, offset, true);
      central.push(new Uint8Array(ch.buffer), name);
      offset += 30 + name.length + body.length;
    }
    let cdSize = 0;
    for (const c of central) cdSize += c.length;
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true);
    end.setUint16(8, files.length, true);
    end.setUint16(10, files.length, true);
    end.setUint32(12, cdSize, true);
    end.setUint32(16, offset, true);
    return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: mime || 'application/zip' });
  }

  return { read, write, crc32 };
})();

/* ===== htmlbuild.js ===== */
/* 가져오기(docx/doc/rtf)에서 공통으로 쓰는 HTML 조립 도우미.
   run 항목: { t:'text', text, props } | { t:'br' } | { t:'img', src, w, h }
   props: { b, i, u, s, sup, sub, color, bg, sizePt, ascii, ea, href } */
const HtmlBuild = (() => {
  const KEYS = ['b', 'i', 'u', 's', 'sup', 'sub', 'color', 'bg', 'sizePt', 'ascii', 'ea', 'href'];

  function sameProps(a, b) {
    for (const k of KEYS) if ((a[k] || null) !== (b[k] || null)) return false;
    return true;
  }

  /** 링크는 웹·메일 주소만 허용 (javascript: 등은 버림) */
  function safeHref(h) {
    return h && /^(https?:|mailto:|ftp:)/i.test(String(h).trim()) ? String(h).trim() : null;
  }

  function spanStyle(p) {
    const st = [];
    const ascii = p.ascii ? canonicalFont(p.ascii) : LW.DEFAULT_FONT;
    const ea = p.ea ? canonicalFont(p.ea) : null;
    if (ascii !== LW.DEFAULT_FONT || (ea && ea !== LW.DEFAULT_FONT)) st.push('font-family:' + cssFontStack([ascii, ea || LW.DEFAULT_FONT]).replace(/"/g, "'"));
    if (p.sizePt && Math.abs(p.sizePt - LW.DEFAULT_SIZE_PT) > 0.01) st.push('font-size:' + p.sizePt + 'pt');
    if (p.color) st.push('color:#' + p.color);
    if (p.bg) st.push('background-color:#' + p.bg);
    return st.join(';');
  }

  function formatted(doc, text, p) {
    let node = doc.createTextNode(text);
    const wrap = (tag) => {
      const el = doc.createElement(tag);
      el.appendChild(node);
      node = el;
    };
    if (p.sup) wrap('sup');
    else if (p.sub) wrap('sub');
    if (p.s) wrap('s');
    if (p.u) wrap('u');
    if (p.i) wrap('i');
    if (p.b) wrap('b');
    return node;
  }

  function appendRuns(doc, parent, items) {
    // 1) 같은 서식의 연속된 텍스트 합치기
    const merged = [];
    for (const it of items) {
      const last = merged[merged.length - 1];
      if (it.t === 'text') {
        if (!it.text) continue;
        if (last && last.t === 'text' && sameProps(last.props, it.props)) last.text += it.text;
        else merged.push({ t: 'text', text: it.text, props: it.props || {} });
      } else merged.push(it);
    }
    // 2) 링크와 글꼴·크기·색이 같은 연속 구간을 하나의 요소로 묶어 출력
    let i = 0;
    while (i < merged.length) {
      const it = merged[i];
      if (it.t !== 'text') {
        if (it.t === 'br') parent.appendChild(doc.createElement('br'));
        else if (it.t === 'img') {
          const img = doc.createElement('img');
          img.setAttribute('src', it.src);
          if (it.w) img.setAttribute('width', Math.round(it.w));
          if (it.h) img.setAttribute('height', Math.round(it.h));
          parent.appendChild(img);
        }
        i++;
        continue;
      }
      const href = safeHref(it.props.href);
      const style = spanStyle(it.props);
      let target = parent;
      if (href) {
        target = doc.createElement('a');
        target.setAttribute('href', href);
        parent.appendChild(target);
      }
      if (style) {
        const span = doc.createElement('span');
        span.setAttribute('style', style);
        target.appendChild(span);
        target = span;
      }
      while (i < merged.length && merged[i].t === 'text' && safeHref(merged[i].props.href) === href && spanStyle(merged[i].props) === style) {
        target.appendChild(formatted(doc, merged[i].text, merged[i].props));
        i++;
      }
    }
    // 빈 문단도 편집 가능하도록 <br> 유지, 끝에 줄바꿈이 있으면 표시용 <br> 추가
    const last = parent.lastChild;
    if (!last || last.nodeName === 'BR') parent.appendChild(doc.createElement('br'));
  }

  /** 문단 속성 적용. pp: { align, indLeftTw, firstTw, beforeTw, afterTw, line, lineRule } */
  function applyPara(el, pp, opts) {
    opts = opts || {};
    if (pp.align && pp.align !== 'left') el.style.textAlign = pp.align;
    if (!opts.list) {
      if (pp.indLeftTw) el.style.marginLeft = Math.round(pp.indLeftTw / 15) + 'px';
      if (pp.firstTw) el.style.textIndent = Math.round(pp.firstTw / 15) + 'px';
    }
    if (opts.list || opts.cell === 'skipSpacing') return;
    const before = (pp.beforeTw || 0) / 20;
    const after = (pp.afterTw || 0) / 20;
    const isP = el.nodeName === 'P' || el.nodeName === 'DIV';
    if (!isP || Math.abs(before) > 0.01) el.style.marginTop = before + 'pt';
    if (!isP || Math.abs(after - LW.DEFAULT_AFTER_PT) > 0.01) el.style.marginBottom = after + 'pt';
    const rule = pp.lineRule || 'auto';
    const line = pp.line || 240;
    if (rule === 'auto') {
      const mul = line / 240;
      if (!isP || Math.abs(mul - LW.DEFAULT_LINE) > 0.005) el.style.lineHeight = String(+(mul * LW.LINE_FACTOR).toFixed(3));
    } else {
      el.style.lineHeight = +(line / 20).toFixed(1) + 'pt';
    }
  }

  function pageBreak(doc) {
    const d = doc.createElement('div');
    d.className = 'page-break';
    d.setAttribute('contenteditable', 'false');
    return d;
  }

  /** 문단 + 목록 스택 관리자 */
  function makeSink(doc, root) {
    let stack = []; // { level, ordered, key, el, lastLi }
    return {
      root,
      block(el) {
        stack = [];
        root.appendChild(el);
      },
      item(level, ordered, key, start) {
        level = Math.max(0, Math.min(8, level | 0));
        while (stack.length && stack[stack.length - 1].level > level) stack.pop();
        let top = stack[stack.length - 1];
        if (top && top.level === level && (top.ordered !== ordered || (ordered && top.key !== key))) {
          stack.pop();
          top = stack[stack.length - 1];
        }
        if (!top || top.level < level) {
          const list = doc.createElement(ordered ? 'ol' : 'ul');
          if (ordered && start && start !== 1) list.setAttribute('start', start);
          if (top) {
            if (!top.lastLi) {
              top.lastLi = doc.createElement('li');
              top.el.appendChild(top.lastLi);
            }
            top.lastLi.appendChild(list);
          } else root.appendChild(list);
          top = { level, ordered, key, el: list, lastLi: null };
          stack.push(top);
        }
        const li = doc.createElement('li');
        top.el.appendChild(li);
        top.lastLi = li;
        return li;
      },
      endList() {
        stack = [];
      },
    };
  }

  /** 행별 칸 경계(twip)와 병합 표시로 표 만들기.
      rows: [{ tds:[td], centers:[x0..xn] | null, tcs:[{ hm: 0|1|2, vm: 0|1|3 }] }]
      hm 2 = 앞 칸과 가로 병합, vm 3 = 세로 병합 시작, vm 1 = 위 칸과 세로 병합 */
  function buildTable(doc, rows) {
    const table = doc.createElement('table');
    const tbody = doc.createElement('tbody');
    const bset = new Set();
    rows.forEach((r) => r.centers && r.centers.forEach((x) => bset.add(x)));
    const grid = [...bset].sort((a, b) => a - b);
    if (grid.length > 1) {
      const total = grid[grid.length - 1] - grid[0];
      const cg = doc.createElement('colgroup');
      for (let k = 0; k + 1 < grid.length; k++) {
        const col = doc.createElement('col');
        col.setAttribute('style', 'width:' + (((grid[k + 1] - grid[k]) / total) * 100).toFixed(2) + '%');
        cg.appendChild(col);
      }
      table.appendChild(cg);
      if (total > 0 && total < LW.CONTENT_W_TW * 0.95) table.style.width = Math.round(total / 15) + 'px';
    }
    table.appendChild(tbody);
    const owner = {};
    for (const row of rows) {
      const tr = doc.createElement('tr');
      const centers = row.centers && row.centers.length > row.tds.length ? row.centers : null;
      let prev = null;
      row.tds.forEach((td, k) => {
        if (!td.firstChild) td.appendChild(doc.createElement('div')).appendChild(doc.createElement('br'));
        if (!centers) { tr.appendChild(td); return; }
        const c0 = grid.indexOf(centers[k]);
        const span = Math.max(1, grid.indexOf(centers[k + 1]) - c0);
        const f = (row.tcs && row.tcs[k]) || { hm: 0, vm: 0 };
        if (f.hm === 2 && prev) { prev.colSpan += span; return; }
        if (f.vm === 1 && owner[c0]) { owner[c0].rowSpan += 1; return; }
        if (span > 1) td.colSpan = span;
        tr.appendChild(td);
        prev = td;
        owner[c0] = f.vm === 3 ? td : null;
      });
      if (tr.children.length) tbody.appendChild(tr);

      if (!v) return undefined;
      const n = parseFloat(v);
      if (isNaN(n)) return undefined;
      if (/pt$/.test(v)) return Math.round(n * 20);
      if (/px$/.test(v)) return Math.round(n * 15);
      if (/em$/.test(v)) return Math.round(n * LW.DEFAULT_SIZE_PT * 20);
      return Math.round(n * 15);
    }

    function runProps(textParent, block, baseEl) {
      const s = style(textParent);
      const base = style(baseEl);
      const p = {};
      let sizeSrc = s;
      for (let el = textParent; el && el !== block && el !== root; el = el.parentElement) {
        const es = style(el);

      if (b !== boldOf(base)) p.b = b;
      if (i !== italicOf(base)) p.i = i;
      const sz = sizePt(sizeSrc);
      if (sz !== sizePt(base)) p.sizePt = sz;
      const col = cssColorToHex(s.color);
      if (col && col !== cssColorToHex(base.color)) p.color = col;
      if (s.fontFamily !== base.fontFamily) {
        const f = parseFontStack(s.fontFamily);
        const bf = parseFontStack(base.fontFamily);
        if (f.ascii !== bf.ascii || f.eastAsia !== bf.eastAsia) { p.ascii = f.ascii; p.ea = f.eastAsia; }

    function imageRun(img) {

    function walkList(listEl, out, ctx, level) {

        else if (c.nodeType === 1 && !hidden(c)) pushPara(c, [c], out, lctx, false);

    function walkLi(li, out, ctx) {

      let produced = false;
      const before = out.length;
      const flush = (force) => {
        if (inline.length || force) {
          pushPara(li, inline, out, ctx, force);
          inline = [];
        }
      };
      for (const n of li.childNodes) {
        if (n.nodeType === 1 && (n.nodeName === 'UL' || n.nodeName === 'OL')) {
          flush(out.length === before);
          walkList(n, out, ctx, ctx.list.level + 1);
        } else if (n.nodeType === 1 && isBlock(n) && !hidden(n)) {
          flush(false);

    }

    function tableModel(table, ctx) {

        occ[r] = occ[r] || [];

          const cell = { col: c, colspan: cs, rowspan: rs, el: td };
          for (let i = 0; i < rs; i++) {
            occ[r + i] = occ[r + i] || [];

          }
          model[r].push(cell);

        }

      const known = widths.filter(Boolean);
      const rest = (tw - known.reduce((a, b) => a + b, 0)) / Math.max(1, nCols - known.length);
      for (let i = 0; i < nCols; i++) if (!widths[i]) widths[i] = Math.max(20, rest);
      // 행 구성: 세로 병합된 칸은 계속(cont) 칸으로 채움
      const outRows = model.map((_, r) => {
        const cells = [];
        for (let c = 0; c < nCols;) {
          const o = occ[r][c];
          if (!o) { cells.push({ col: c, colspan: 1, rowspan: 1, blocks: [] }); c++; continue; }
          const cell = o.cont ? o.origin : o;
          if (o.cont && cell.col !== c) { c++; continue; }

              header: cell.el.nodeName === 'TH',

      });

    const blocks = [];
    walkContainer(root, blocks, { list: null, inCell: false });

  }

  /** 모델 → 일반 텍스트 */
  function toText(model) {
    const lines = [];
    const counters = {};
    const runText = (runs) => runs.map((r) => (r.t === 'text' ? r.text : r.t === 'br' ? '\n' : '')).join('');
    const emit = (blocks, indent) => {
      for (const b of blocks) {
        if (b.type === 'pagebreak') { lines.push('\f'); continue; }
        if (b.type === 'table') {
          for (const row of b.rows) {
            lines.push(indent + row.filter((c) => !c.cont).map((c) => {
              const t = [];
              c.blocks.forEach((cb) => cb.type === 'para' && t.push(runText(cb.runs).replace(/\n/g, ' ')));
              return t.join(' ');
            }).join('\t'));
          }
          continue;
        }
        let prefix = '';
        if (b.list) {
          const pad = '    '.repeat(b.list.level);
          if (b.list.ordered) {
            const k = b.list.key + ':' + b.list.level;
            counters[k] = (counters[k] || (b.list.start || 1) - 1) + 1;
            for (const key of Object.keys(counters)) {
              const [kk, lv] = key.split(':');
              if (kk === b.list.key && +lv > b.list.level) delete counters[key];
            }
            prefix = pad + counters[k] + '. ';
          } else prefix = pad + '• ';
        }
        lines.push(indent + prefix + runText(b.runs));
      }
    };
    emit(model.blocks, '');
    return lines.join('\n').replace(/\r?\n/g, '\r\n');
  }

  return { extract, toText };
})();

    if (/px$/.test(line)) return { line: Math.round(n * 15), rule: 'exact' };
    if (/%$/.test(line)) return { line: Math.round((n / 100 / LW.LINE_FACTOR) * 240), rule: 'auto' };

        `<w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="108" w:type="dxa"/><w:right w:w="108" w:type="dxa"/></w:tblCellMar></w:tblPr>`;
      x += '<w:tblGrid>' + tw.map((w) => `<w:gridCol w:w="${w}"/>`).join('') + '</w:tblGrid>';

      '<Default Extension="xml" ContentType="application/xml"/>' +

      '<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" ' +

      'xmlns:dcmitype="http://purl.org/dc/dcmitype/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">' +
      `<dc:title>${X(meta.title || '')}</dc:title>` +
      `<dcterms:created xsi:type="dcterms:W3CDTF">${now}</dcterms:created>` +

      '<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties" ' +
      'xmlns:vt="http://schemas.openxmlformats.org/officeDocument/2006/docPropsVTypes"><Application>현서의 글방</Application></Properties>';

  function settingsXml() {

      `<w:settings xmlns:w="${NS_W}"><w:defaultTabStop w:val="720"/><w:characterSpacingControl w:val="doNotCompress"/>` +
      '<w:compat><w:compatSetting w:name="compatibilityMode" w:uri="http://schemas.microsoft.com/office/word" w:val="15"/></w:compat>' +
      '</w:settings>';
  }

  function stylesXml() {
    const f = X(LW.DEFAULT_FONT);
    const sz = LW.DEFAULT_SIZE_PT * 2;
    let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
      `<w:styles xmlns:w="${NS_W}"><w:docDefaults><w:rPrDefault><w:rPr>` +
      `<w:rFonts w:ascii="${f}" w:eastAsia="${f}" w:hAnsi="${f}" w:cs="${f}"/>` +
      `<w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/><w:lang w:val="en-US" w:eastAsia="ko-KR" w:bidi="ar-SA"/></w:rPr></w:rPrDefault>` +

      '<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/><w:pPr><w:wordWrap w:val="0"/></w:pPr></w:style>' +
      '<w:style w:type="character" w:default="1" w:styleId="DefaultParagraphFont"><w:name w:val="Default Paragraph Font"/><w:uiPriority w:val="1"/><w:semiHidden/><w:unhideWhenUsed/></w:style>' +
      '<w:style w:type="table" w:default="1" w:styleId="TableNormal"><w:name w:val="Normal Table"/><w:uiPriority w:val="99"/><w:semiHidden/><w:unhideWhenUsed/>' +
      '<w:tblPr><w:tblInd w:w="0" w:type="dxa"/><w:tblCellMar><w:top w:w="0" w:type="dxa"/><w:left w:w="108" w:type="dxa"/><w:bottom w:w="0" w:type="dxa"/><w:right w:w="108" w:type="dxa"/></w:tblCellMar></w:tblPr></w:style>' +
      '<w:style w:type="numbering" w:default="1" w:styleId="NoList"><w:name w:val="No List"/><w:uiPriority w:val="99"/><w:semiHidden/><w:unhideWhenUsed/></w:style>';

      '<w:pPr><w:spacing w:after="0"/><w:ind w:left="720"/></w:pPr></w:style>';

  }

  function numberingXml(nums) {
    let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' + `<w:numbering xmlns:w="${NS_W}">`;
    for (const ordered of [false, true]) {
      x += `<w:abstractNum w:abstractNumId="${ordered ? 1 : 0}"><w:multiLevelType w:val="hybridMultilevel"/>`;
      for (let i = 0; i < 9; i++) {

    }
    for (const n of nums) {
      x += `<w:num w:numId="${n.numId}"><w:abstractNumId w:val="${n.ordered ? 1 : 0}"/>`;
      if (n.ordered) x += `<w:lvlOverride w:ilvl="0"><w:startOverride w:val="${n.start}"/></w:lvlOverride>`;

    }
    return x + '</w:numbering>';
  }

  return { build };

/* ===== doc-import.js ===== */
/* .doc (Word 97-2003 이진 형식) → 편집기 HTML
   지원: 본문 텍스트, 문단(제목/정렬/들여쓰기/간격), 글자 서식(굵게/기울임/밑줄/취소선/크기/색/글꼴/위·아래 첨자),
         글머리표·번호 목록, 표(병합 제외), 쪽 나누기, 하이퍼링크 필드. 그림은 가져오지 않음. */
const DocImport = (() => {
  // ---------- Compound File Binary ----------
  function readCfb(u8) {
    const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    const sig = [0xd0, 0xcf, 0x11, 0xe0, 0xa1, 0xb1, 0x1a, 0xe1];
    if (!sig.every((b, i) => u8[i] === b)) throw new Error('Word 97-2003 문서 형식이 아닙니다.');
    const secSize = 1 << dv.getUint16(0x1e, true);
    const miniSize = 1 << dv.getUint16(0x20, true);
    const numFat = dv.getUint32(0x2c, true);
    const dirStart = dv.getUint32(0x30, true);
    const miniCutoff = dv.getUint32(0x38, true);
    const miniFatStart = dv.getUint32(0x3c, true);
    let difat = dv.getUint32(0x44, true);
    const fatSecs = [];
    for (let i = 0; i < 109 && fatSecs.length < numFat; i++) fatSecs.push(dv.getUint32(0x4c + i * 4, true));
    let guard = 0;
    while (difat < 0xfffffffa && fatSecs.length < numFat && guard++ < 10000) {
      const off = (difat + 1) * secSize;
      for (let i = 0; i < secSize / 4 - 1 && fatSecs.length < numFat; i++) fatSecs.push(dv.getUint32(off + i * 4, true));
      difat = dv.getUint32(off + secSize - 4, true);
    }
    const fat = new Uint32Array(fatSecs.length * (secSize / 4));
    fatSecs.forEach((s, k) => {
      const off = (s + 1) * secSize;
      for (let i = 0; i < secSize / 4; i++) fat[k * (secSize / 4) + i] = off + i * 4 + 4 <= u8.length ? dv.getUint32(off + i * 4, true) : 0xfffffffe;
    });
    const chain = (start, table) => {
      const out = [];
      const seen = new Set();
      for (let s = start; s < 0xfffffffa && !seen.has(s) && s < table.length; s = table[s]) {
        seen.add(s);
        out.push(s);
      }
      return out;
    };
    const readChain = (start, size) => {
      const secs = chain(start, fat);
      const buf = new Uint8Array(secs.length * secSize);
      secs.forEach((s, i) => buf.set(u8.subarray((s + 1) * secSize, (s + 2) * secSize), i * secSize));
      return size === undefined ? buf : buf.subarray(0, size);
    };
    const dir = readChain(dirStart);
    const ddv = new DataView(dir.buffer);
    const entries = [];
    for (let off = 0; off + 128 <= dir.length; off += 128) {
      const nameLen = ddv.getUint16(off + 64, true);
      let name = '';
      for (let i = 0; i < Math.max(0, nameLen / 2 - 1); i++) name += String.fromCharCode(ddv.getUint16(off + i * 2, true));
      entries.push({ name, type: dir[off + 66], start: ddv.getUint32(off + 116, true), size: ddv.getUint32(off + 120, true) });
    }
    const root = entries[0];
    const ministream = root ? readChain(root.start, root.size) : new Uint8Array(0);
    let minifat = new Uint32Array(0);
    if (miniFatStart < 0xfffffffa) {
      const mf = readChain(miniFatStart);
      minifat = new Uint32Array(mf.buffer, 0, mf.length / 4);
    }
    return {
      stream(name) {
        const e = entries.find((x) => x.type === 2 && x.name === name);
        if (!e) return null;
        if (e.size < miniCutoff) {
          const secs = chain(e.start, minifat);
          const buf = new Uint8Array(secs.length * miniSize);
          secs.forEach((s, i) => buf.set(ministream.subarray(s * miniSize, (s + 1) * miniSize), i * miniSize));
          return buf.subarray(0, e.size);
        }
        return readChain(e.start, e.size);
      },
    };
  }

  // ---------- sprm ----------
  function sprms(g, fn) {
    let i = 0;
    while (i + 2 <= g.length) {
      const op = g[i] | (g[i + 1] << 8);
      const spra = op >> 13;
      let size;
      if (spra === 0 || spra === 1) size = 1;
      else if (spra === 2 || spra === 4 || spra === 5) size = 2;
      else if (spra === 3) size = 4;
      else if (spra === 7) size = 3;
      else if (op === 0xd608 || op === 0xd606) size = ((g[i + 2] | (g[i + 3] << 8)) - 1) + 2;
      else size = 1 + (g[i + 2] || 0);
      fn(op, g.subarray(i + 2, i + 2 + size));
      i += 2 + Math.max(0, size);
    }

  const u16 = (d, o = 0) => d[o] | (d[o + 1] << 8);
  const i16 = (d, o = 0) => (u16(d, o) << 16) >> 16;

  function applyChp(p, g, fonts) {
    const tog = (key, v) => {
      if (v === 0x80) return;
      p[key] = v === 0x81 ? !p[key] : !!v;
    };
    sprms(g, (op, d) => {
      switch (op) {
        case 0x0835: tog('b', d[0]); break;
        case 0x0836: tog('i', d[0]); break;
        case 0x0837: case 0x2a53: tog('s', d[0]); break;
        case 0x083c: tog('hidden', d[0]); break;
        case 0x2a3e: p.u = d[0] !== 0; break;
        case 0x4a43: p.sizePt = u16(d) / 2; break;
        case 0x2a42: p.color = ICO_COLORS[d[0]] || null; break;
        case 0x6870: p.color = d[3] === 0xff ? null : [d[0], d[1], d[2]].map((x) => x.toString(16).padStart(2, '0')).join('').toUpperCase(); break;
        case 0x2a0c: p.bg = ICO_COLORS[d[0]] || null; break;
        case 0x2a48: p.sup = d[0] === 1; p.sub = d[0] === 2; break;
        case 0x4a4f: if (fonts[u16(d)]) p.ascii = fonts[u16(d)]; break;
        case 0x4a50: if (fonts[u16(d)]) p.ea = fonts[u16(d)]; break;
        case 0x4a30: p.istd = u16(d); break;
        case 0x6a03: p.picLoc = (d[0] | (d[1] << 8) | (d[2] << 16) | (d[3] << 24)) >>> 0; break;
      }
    });
    return p;
  }

  function applyPap(p, g) {
    sprms(g, (op, d) => {
      switch (op) {
        case 0x2403: case 0x2461: p.align = ['left', 'center', 'right', 'justify', 'justify'][d[0]] || 'left'; break;
        case 0x2416: p.inTable = d[0] !== 0; break;
        case 0x2417: p.ttp = d[0] !== 0; break;
        case 0x6649: p.itap = u16(d); break;
        case 0x460b: p.ilfo = i16(d); break;
        case 0x260a: p.ilvl = d[0]; break;
        case 0x840f: case 0x845e: p.indLeftTw = i16(d); break;
        case 0x8411: case 0x8460: p.firstTw = i16(d); break;
        case 0xa413: p.beforeTw = u16(d); break;
        case 0xa414: p.afterTw = u16(d); break;
        case 0x6412: {
          const line = i16(d), mult = i16(d, 2);
          if (mult === 1) { p.line = line; p.lineRule = 'auto'; } else { p.line = Math.abs(line); p.lineRule = 'exact'; }

        case 0x2407: p.pageBreakBefore = d[0] !== 0; break;
        case 0xd608: {

          const n = d[2];
          const centers = [];
          for (let k = 0; k <= n && 3 + k * 2 + 1 < d.length; k++) centers.push(i16(d, 3 + k * 2));
          const tcs = [];
          let o = 3 + (n + 1) * 2;

    });

  }

  function convert(buf, doc) {

    const wd = cfb.stream('WordDocument');
    if (!wd) throw new Error('Word 문서가 아닙니다. (WordDocument 스트림 없음)');

    if (wdv.getUint16(0, true) !== 0xa5ec) throw new Error('Word 문서 서명이 올바르지 않습니다.');
    const nFib = wdv.getUint16(2, true);

        const stshi = fc + 2;
        const cstd = tdv.getUint16(stshi, true);
        const cbBase = tdv.getUint16(stshi + 2, true);
        let p = stshi + cbStshi;
        for (let k = 0; k < cstd && p + 2 <= fc + lcb; k++) {
          const cbStd = tdv.getUint16(p, true);
          const s = p + 2;
          p += 2 + cbStd;
          if (!cbStd) { stylesArr.push(null); continue; }
          const sti = tdv.getUint16(s, true) & 0x0fff;
          const stk = tdv.getUint16(s + 2, true) & 0x000f;
          const istdBase = tdv.getUint16(s + 2, true) >> 4;
          const cupx = tdv.getUint16(s + 4, true) & 0x000f;
          let q = s + cbBase;
          const cch = tdv.getUint16(q, true);
          q += 2 + cch * 2 + 2;
          const upx = [];
          for (let u = 0; u < cupx && q + 2 <= s + cbStd; u++) {
            const cbUpx = tdv.getUint16(q, true);
            upx.push(table.subarray(q + 2, q + 2 + cbUpx));
            q += 2 + cbUpx;
            if ((q - s) & 1) q++;

          let papx = null, chpx = null;
          if (stk === 1) { papx = upx[0] ? upx[0].subarray(2) : null; chpx = upx[1] || null; }

    const styleChain = (istd) => {
      const out = [];

    const styleCache = new Map();
    const styleProps = (istd) => {
      if (styleCache.has(istd)) return styleCache.get(istd);

    };

    // 목록
    const lists = {};
    const lfos = [];
    {
      const [fc, lcb] = fcLcb(73);

            const cch = tdv.getUint16(p, true);

          }

        }
      }
      const [fo, lo] = fcLcb(74);
      if (lo > 4) {
        const n = tdv.getInt32(fo, true);
        for (let k = 0; k < n; k++) lfos.push(tdv.getInt32(fo + 4 + k * 16, true));

    // 조각 표(piece table)
    const pieces = [];
    {
      const [fc, lcb] = fcLcb(33);

      while (p < fc + lcb) {

        if (clxt === 1) p += 3 + tdv.getUint16(p + 1, true);

    let items = [];
    let curText = '', curProps = null;

          closeTable();

      if (code === 0x0b) { flushText(); items.push({ t: 'br' }); continue; }
      if (code === 0x0c) { flushText(); items.push({ t: 'pagebreak' }); continue; }

      else if (code === 0x1f) continue;

      if (curProps !== props) { flushText(); curProps = props; }

    flushText();
    if (items.length) emitPara(items, papAt(fcs[fcs.length - 1] || 0), null);

    if (!frag.firstChild) {
      const p = doc.createElement('div');
      p.appendChild(doc.createElement('br'));
      frag.appendChild(p);
    }
    return { fragment: frag, stats };
  }

  return { convert };
})();

    136: 'big5', 161: 'windows-1253', 162: 'windows-1254', 163: 'windows-1258', 177: 'windows-1255', 178: 'windows-1256',

    'latentstyles', 'datastore', 'filetbl', 'revtbl', 'pgdsctbl', 'mmathPr', 'xe', 'tc', 'bkmkstart', 'bkmkend', 'nonshppict',
