# PDF 편집기 - 윈도우 설치 파일 자동 빌드
# pdf_tool 폴더가 바뀌어 push 되면 실행되고, 결과 설치 파일은
# Actions 실행 페이지 하단의 "Artifacts" 에서 내려받을 수 있다.
#
# 보안:
# - 외부 Action 은 태그가 아니라 커밋 SHA 로 고정 (태그 바꿔치기 공격 방지)
# - Python 패키지는 SHA-256 해시로 고정 (requirements-lock.txt)
# - 빌드 전에 알려진 취약점(pip-audit)과 코드 정적 분석(bandit) 검사 → 문제 있으면 빌드 중단
# - 테스트/빌드는 읽기 권한만으로 실행, 체크아웃 후 토큰을 남기지 않음
# - Releases 업로드는 별도 job 에서만 쓰기 권한 사용. 빌드 코드는 이 권한을 받지 않는다.
#   업로드 전에 체크섬을 다시 검증하고, 정해진 브랜치에서만 공식 다운로드 파일을 바꾼다.
name: PDF 편집기 윈도우 빌드

on:
  push:
    paths:
      - "pdf_tool/**"
      - ".github/workflows/pdf-tool-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pdf_tool
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: 검사 도구 설치
        run: pip install pip-audit==2.10.1 bandit==1.9.4

      - name: 의존성 취약점 검사 (pip-audit)
        run: pip-audit --no-deps --disable-pip --progress-spinner off -r requirements-lock.txt

      - name: 코드 정적 분석 (bandit, 중간 이상 심각도)
        run: bandit -r pdftool main.py installer -ll

  build:
    needs: security-scan
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.inno.outputs.version }}
    defaults:
      run:
        shell: pwsh
        working-directory: pdf_tool
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: 패키지 설치 (해시 검증)
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps --require-hashes -r requirements-lock.txt

      - name: 테스트
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: 실행 파일 만들기 (PyInstaller)
        run: |
          python installer/make_icon.py installer/app.ico
          pyinstaller --noconfirm --clean installer/pdftool.spec --distpath dist --workpath build

      - name: 실행 파일 자체 점검 (실제 윈도우 화면 모드)
        env:
          QT_QPA_PLATFORM: windows
        run: |
          $p = Start-Process -FilePath "dist\PdfEditor\PdfEditor.exe" -ArgumentList "--selftest" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "selftest 실패 (exit $($p.ExitCode))" }
          "selftest OK"
          # 설치 용량 내역 (어떤 파일이 용량을 차지하는지)
          $all = Get-ChildItem dist\PdfEditor -Recurse -File
          "설치 후 총 용량: {0:N1} MB ({1}개 파일)" -f (($all | Measure-Object Length -Sum).Sum / 1MB), $all.Count
          $root = (Resolve-Path dist\PdfEditor\_internal).Path
          Get-ChildItem $root -Directory | ForEach-Object {
            [pscustomobject]@{ MB = [math]::Round(((Get-ChildItem $_.FullName -Recurse -File | Measure-Object Length -Sum).Sum / 1MB), 1); Name = $_.Name }
          } | Sort-Object MB -Descending | Select-Object -First 8 | Format-Table -AutoSize | Out-String -Width 120
          $all | Sort-Object Length -Descending | Select-Object -First 12 @{n="MB";e={[math]::Round($_.Length/1MB,1)}}, @{n="File";e={$_.FullName.Replace($root, "")}} | Format-Table -AutoSize | Out-String -Width 200

      - name: 설치 파일 만들기 (Inno Setup)
        id: inno
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --version=6.7.1 -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup 설치 실패" }
          }
          & $iscc /? | Select-Object -First 1
          $version = python -c "import pdftool; print(pdftool.__version__)"
          $defs = @("/DAppVersion=$version")
          if (Test-Path (Join-Path (Split-Path $iscc) "Languages\Korean.isl")) { $defs += "/DKOREAN"; "한국어 설치 화면" } else { "영어 설치 화면 (Korean.isl 없음)" }
          & $iscc @defs installer\setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 실패" }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "버전 형식 오류: $version" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 설치 파일 무인 설치/실행 확인
        run: |
          $setup = Get-ChildItem dist\PdfEditor-Setup-*.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "PdfEditorInstall"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "설치 실패 (exit $($p.ExitCode))" }
          $env:QT_QPA_PLATFORM = "windows"
          $p = Start-Process -FilePath (Join-Path $dir "PdfEditor.exe") -ArgumentList "--selftest" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "설치본 selftest 실패" }
          "installed selftest OK"

      - name: 설치 파일 SHA-256 체크섬 기록
        run: |
          Get-ChildItem dist\PdfEditor-Setup-*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            # 리눅스 sha256sum 형식, 줄바꿈 LF (release job 에서 sha256sum --check 로 재검증)
            [IO.File]::WriteAllText("$($_.FullName).sha256", "$h  $($_.Name)`n", [Text.Encoding]::ASCII)
            "{0}  {1:N1} MB  sha256={2}" -f $_.Name, ($_.Length / 1MB), $h
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PdfEditor-Setup-${{ env.VERSION }}
          path: |
            pdf_tool/dist/PdfEditor-Setup-*.exe
            pdf_tool/dist/PdfEditor-Setup-*.exe.sha256
          if-no-files-found: error

  release:
    # 공식 다운로드 파일은 정해진 브랜치에 push 했을 때만 바꾼다 (실험용 브랜치가 덮어쓰지 않도록)
    needs: build
    if: >-
      github.event_name == 'push' &&
      (github.ref_name == github.event.repository.default_branch ||
       github.ref_name == 'claude/trusting-mayer-thzzeo')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Releases 업로드 (이 job 에만 부여)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: PdfEditor-Setup-${{ needs.build.outputs.version }}
          path: dist

      - name: 체크섬 재검증
        working-directory: dist
        run: |
          ls -la
          sha256sum --check --strict PdfEditor-Setup-*.exe.sha256

      - name: Releases 에 설치 파일 올리기 (바로 다운로드 링크)
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "버전 형식 오류"; exit 1; }
          tag="pdf-editor-v$VERSION"
          hash="$(cut -d' ' -f1 "PdfEditor-Setup-$VERSION.exe.sha256")"
          # 같은 버전을 다시 빌드하면 이전 릴리스를 지우고 최신 빌드로 교체
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            gh release delete "$tag" --repo "$REPO" --yes --cleanup-tag
          fi
          notes="## 설치 방법
          1. 아래 Assets 에서 **PdfEditor-Setup-$VERSION.exe** 를 눌러 다운로드
          2. 실행 → \"Windows의 PC 보호\" 창이 뜨면 **추가 정보 → 실행**
          3. 안내에 따라 설치 (관리자 권한 불필요)

          SHA-256: \`$hash\`"
          gh release create "$tag" "PdfEditor-Setup-$VERSION.exe" "PdfEditor-Setup-$VERSION.exe.sha256" \
            --repo "$REPO" --target "$SHA" --title "PDF 편집기 $VERSION" --notes "$notes" --latest
          echo "https://github.com/$REPO/releases/tag/$tag"
