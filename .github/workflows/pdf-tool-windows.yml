# PDF 편집기 - 윈도우 설치 파일 자동 빌드
# pdf_tool 폴더가 바뀌어 push 되면 실행되고, 결과 설치 파일은
# Actions 실행 페이지 하단의 "Artifacts" 에서 내려받을 수 있다.
#
# 보안:
# - 외부 Action 은 태그가 아니라 커밋 SHA 로 고정 (태그 바꿔치기 공격 방지)
# - Python 패키지는 SHA-256 해시로 고정 (requirements-lock.txt)
# - 빌드 전에 알려진 취약점(pip-audit)과 코드 정적 분석(bandit) 검사 → 문제 있으면 빌드 중단
# - 저장소 읽기 권한만 사용, 체크아웃 후 토큰을 남기지 않음
name: PDF 편집기 윈도우 빌드

on:
  push:
    paths:
      - "pdf_tool/**"
      - ".github/workflows/pdf-tool-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pdf_tool
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: 검사 도구 설치
        run: pip install pip-audit==2.10.1 bandit==1.9.4

      - name: 의존성 취약점 검사 (pip-audit)
        run: pip-audit --no-deps --disable-pip --progress-spinner off -r requirements-lock.txt

      - name: 코드 정적 분석 (bandit, 중간 이상 심각도)
        run: bandit -r pdftool main.py installer -ll

  build:
    needs: security-scan
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write # Releases 에 설치 파일을 올리기 위해 (이 job 에만 부여)
    defaults:
      run:
        shell: pwsh
        working-directory: pdf_tool
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: 패키지 설치 (해시 검증)
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps --require-hashes -r requirements-lock.txt

      - name: 테스트
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: 실행 파일 만들기 (PyInstaller)
        run: |
          python installer/make_icon.py installer/app.ico
          pyinstaller --noconfirm --clean installer/pdftool.spec --distpath dist --workpath build

      - name: 실행 파일 자체 점검 (실제 윈도우 화면 모드)
        env:
          QT_QPA_PLATFORM: windows
        run: |
          $p = Start-Process -FilePath "dist\PdfEditor\PdfEditor.exe" -ArgumentList "--selftest" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "selftest 실패 (exit $($p.ExitCode))" }
          "selftest OK"
          "{0:N1} MB" -f ((Get-ChildItem dist\PdfEditor -Recurse | Measure-Object Length -Sum).Sum / 1MB)

      - name: 설치 파일 만들기 (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --version=6.7.1 -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup 설치 실패" }
          }
          & $iscc /? | Select-Object -First 1
          $version = python -c "import pdftool; print(pdftool.__version__)"
          $defs = @("/DAppVersion=$version")
          if (Test-Path (Join-Path (Split-Path $iscc) "Languages\Korean.isl")) { $defs += "/DKOREAN"; "한국어 설치 화면" } else { "영어 설치 화면 (Korean.isl 없음)" }
          & $iscc @defs installer\setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 실패" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 설치 파일 무인 설치/실행 확인
        run: |
          $setup = Get-ChildItem dist\PdfEditor-Setup-*.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "PdfEditorInstall"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "설치 실패 (exit $($p.ExitCode))" }
          $env:QT_QPA_PLATFORM = "windows"
          $p = Start-Process -FilePath (Join-Path $dir "PdfEditor.exe") -ArgumentList "--selftest" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "설치본 selftest 실패" }
          "installed selftest OK"

      - name: 설치 파일 SHA-256 체크섬 기록
        run: |
          Get-ChildItem dist\PdfEditor-Setup-*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Out-File -FilePath "$($_.FullName).sha256" -Encoding ascii
            "{0}  {1:N1} MB  sha256={2}" -f $_.Name, ($_.Length / 1MB), $h
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PdfEditor-Setup-${{ env.VERSION }}
          path: |
            pdf_tool/dist/PdfEditor-Setup-*.exe
            pdf_tool/dist/PdfEditor-Setup-*.exe.sha256
          if-no-files-found: error

      - name: Releases 에 설치 파일 올리기 (바로 다운로드 링크)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          $tag = "pdf-editor-v$env:VERSION"
          # 같은 버전을 다시 빌드하면 이전 릴리스를 지우고 최신 빌드로 교체
          gh release view $tag --repo $env:REPO *> $null
          if ($LASTEXITCODE -eq 0) { gh release delete $tag --repo $env:REPO --yes --cleanup-tag }
          $notes = @"
          ## 설치 방법
          1. 아래 Assets 에서 **PdfEditor-Setup-$env:VERSION.exe** 를 눌러 다운로드
          2. 실행 → "Windows의 PC 보호" 창이 뜨면 **추가 정보 → 실행**
          3. 안내에 따라 설치 (관리자 권한 불필요)

          SHA-256: ``$((Get-Content (Get-ChildItem dist\*.sha256 | Select-Object -First 1).FullName).Split(' ')[0])``
          "@
          $files = (Get-ChildItem dist\PdfEditor-Setup-*.exe*).FullName
          gh release create $tag @files --repo $env:REPO --target $env:SHA --title "PDF 편집기 $env:VERSION" --notes $notes --latest
          if ($LASTEXITCODE -ne 0) { throw "릴리스 생성 실패" }
          "https://github.com/$env:REPO/releases/tag/$tag"
